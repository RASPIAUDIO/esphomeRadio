#########
# Scripts

script:
  - id: show_preset_feedback
    mode: restart
    then:
      - light.turn_on:
          id: screen_backlight
          brightness: 100%
      - lambda: |-
          id(lightTO) = 0;
          if (id(myDisplay).is_ready()) {
            id(myDisplay).show_page(presetP);
            id(myDisplay).update();
          }
      - delay: 2500ms
      - script.execute: reset_display

  - id: play_radio_preset
    mode: restart
    parameters:
      station: string
    then:
      - if:
          condition:
            lambda: return station.find_first_not_of(" \t\r\n") != std::string::npos;
          then:
            - homeassistant.action:
                action: media_player.play_media
                data:
                  media_content_type: radio
                  enqueue: replace
                data_template:
                  entity_id: >-
                    {% set configured = player_entity | trim %}
                    {% if configured and states(configured) not in ['unknown', 'unavailable']
                          and state_attr(configured, 'mass_player_type') is not none %}
                      {{ configured }}
                    {% else %}
                      {% set ns = namespace(entity_id='') %}
                      {% for player in states.media_player %}
                        {% set label = (player.entity_id ~ ' ' ~ player.name) | lower %}
                        {% if ns.entity_id == '' and player.attributes.mass_player_type is defined
                              and 'radio' in label %}
                          {% set ns.entity_id = player.entity_id %}
                        {% endif %}
                      {% endfor %}
                      {{ ns.entity_id }}
                    {% endif %}
                  media_content_id: "{{ station_name }}"
                variables:
                  station_name: !lambda return station;
                  player_entity: !lambda return id(ma_player_entity_id);
                on_error:
                  - lambda: |-
                      id(preset_message) = "PLAY FAILED";
                      ESP_LOGW("radio_preset", "Unable to play station: %s", error.c_str());
                  - script.execute: show_preset_feedback
          else:
            - lambda: 'id(preset_message) = "NO RADIO";'
            - script.execute: show_preset_feedback

  - id: save_radio_preset
    mode: restart
    parameters:
      preset: int
    then:
      - light.turn_on:
          id: screen_backlight
          brightness: 100%
      # Read the currently playing MA queue to save its exact station URI.
      - homeassistant.action:
          action: music_assistant.get_queue
          data_template:
            entity_id: >-
              {% set configured = player_entity | trim %}
              {% if configured and states(configured) not in ['unknown', 'unavailable']
                    and state_attr(configured, 'mass_player_type') is not none %}
                {{ configured }}
              {% else %}
                {% set ns = namespace(named='', metadata='') %}
                {% for player in states.media_player %}
                  {% if player.attributes.mass_player_type is defined
                        and player.state not in ['unknown', 'unavailable'] %}
                    {% set label = (player.entity_id ~ ' ' ~ player.name) | lower %}
                    {% set same_album = current_album | length > 0
                          and player.attributes.media_album_name | default('') == current_album %}
                    {% set same_title = current_title | length > 0
                          and player.attributes.media_title | default('') == current_title %}
                    {% if ns.named == '' and 'radio' in label %}
                      {% set ns.named = player.entity_id %}
                    {% endif %}
                    {% if ns.metadata == '' and (same_album or same_title) %}
                      {% set ns.metadata = player.entity_id %}
                    {% endif %}
                  {% endif %}
                {% endfor %}
                {{ ns.named if ns.named else ns.metadata }}
              {% endif %}
          variables:
            player_entity: !lambda return id(ma_player_entity_id);
            current_title: !lambda return id(ma_media_title).state;
            current_album: !lambda return id(ma_media_album).state;
          capture_response: true
          response_template: >-
            {% set entity_id = response.keys() | list | first | default('') %}{% set item = response[entity_id].get('current_item') if entity_id else none %}{% set media_item = item.get('media_item') if item else none %}{% set uri = state_attr(entity_id, 'media_content_id') or (media_item.get('uri', '') if media_item else '') %}{{ entity_id }}|@|{{ uri }}
          on_success:
            - lambda: |-
                const std::string payload = response["response"].as<std::string>();
                const size_t separator = payload.find("|@|");
                const std::string entity_id = separator == std::string::npos
                    ? "" : payload.substr(0, separator);
                const std::string uri = separator == std::string::npos
                    ? "" : payload.substr(separator + 3);
                const bool valid = !entity_id.empty() && !uri.empty() &&
                                   uri.find("://") != std::string::npos;
                if (!valid) {
                  id(preset_message) = "NO RADIO";
                  ESP_LOGW("radio_preset", "No usable station in MA response: %s", payload.c_str());
                  return;
                }
                if (uri.size() > 255) {
                  id(preset_message) = "URI TOO LONG";
                  ESP_LOGW("radio_preset", "Station URI exceeds the 255-byte preset limit");
                  return;
                }

                text::Text *target = nullptr;
                if (preset == 1) target = id(radio_station_1);
                else if (preset == 2) target = id(radio_station_2);
                else if (preset == 3) target = id(radio_station_3);
                else if (preset == 4) target = id(radio_station_4);
                if (target == nullptr) return;

                id(ma_player_entity_id) = entity_id;
                auto call = target->make_call();
                call.set_value(uri);
                call.perform();
                id(preset_message) = "MEMO " + std::to_string(preset) + " OK";
                ESP_LOGI("radio_preset", "Station stored on button %d via %s",
                         preset, entity_id.c_str());
            - script.execute: show_preset_feedback
          on_error:
            - lambda: |-
                id(preset_message) = "NO RADIO";
                ESP_LOGW("radio_preset", "Unable to read MA queue: %s", error.c_str());
            - script.execute: show_preset_feedback

  - id: schedule_music_refresh
    mode: restart
    then:
      - delay: 200ms
      - if:
          condition:
            lambda: 'return id(music_active) && !id(assist_return_to_ma) && id(myDisplay).is_ready();'
          then:
            - component.update: myDisplay

  - id: temporary_assist
    mode: single
    then:
      - if:
          condition:
            not:
              voice_assistant.connected:
          then:
            - lambda: 'id(preset_message) = "HA OFFLINE";'
            - script.execute: show_preset_feedback
            - script.stop: temporary_assist
      - if:
          condition:
            lambda: 'return id(assist_return_to_ma);'
          then:
            - voice_assistant.stop:
          else:
            - lambda: |-
                id(assist_return_to_ma) = true;
                id(assist_left_ma_group) = false;
                id(phase) = 3;
            # Pause the entire Sendspin group so nearby players do not mask
            # the user's voice. The Radio's shared I2S bus must then stop.
            - media_player.pause: sendspin_media_player
            - wait_until:
                condition:
                  lambda: |-
                    return id(sendspin_media_player).state !=
                        media_player::MEDIA_PLAYER_STATE_PLAYING;
                timeout: 8s
            - if:
                condition:
                  lambda: |-
                    return id(sendspin_media_player).state ==
                        media_player::MEDIA_PLAYER_STATE_PLAYING;
                then:
                  - logger.log:
                      level: ERROR
                      format: "Assist cancelled: Sendspin group did not pause"
                  - lambda: 'id(assist_return_to_ma) = false;'
                  - script.execute: reset_display
                else:
                  - wait_until:
                      condition:
                        lambda: |-
                          return !id(music_active) &&
                              id(radio_speaker).is_stopped();
                      timeout: 6s
                  - if:
                      condition:
                        lambda: |-
                          return id(music_active) ||
                              !id(radio_speaker).is_stopped();
                      then:
                        # If MA paused the group but the local output has not
                        # drained, release only this Radio's I2S bus as a
                        # fallback. SWITCH will rejoin it after Assist.
                        - lambda: 'id(assist_left_ma_group) = true;'
                        - media_player.stop: music_source_player
                        - wait_until:
                            condition:
                              lambda: |-
                                return !id(music_active) &&
                                    id(radio_speaker).is_stopped();
                            timeout: 6s
                  - if:
                      condition:
                        lambda: |-
                          return id(music_active) ||
                              !id(radio_speaker).is_stopped();
                      then:
                        - logger.log:
                            level: ERROR
                            format: "Assist cancelled: Radio did not release the I2S bus"
                        - lambda: 'id(assist_return_to_ma) = false;'
                        - if:
                            condition:
                              lambda: 'return id(assist_left_ma_group);'
                            then:
                              - sendspin.switch: sendspin_hub
                        - media_player.play: sendspin_media_player
                        - script.execute: reset_display
                      else:
                        - light.turn_on: screen_backlight
                        - script.execute: reset_display
                        - voice_assistant.start:
                            silence_detection: true

  - id: finish_temporary_assist
    mode: single
    then:
      - wait_until:
          condition:
            not:
              voice_assistant.is_running:
          timeout: 10s
      - if:
          condition:
            lambda: 'return id(assist_return_to_ma);'
          then:
            - lambda: |-
                id(assist_return_to_ma) = false;
                id(phase) = 1;
            # Release the microphone bus before Sendspin can restart I2S.
            - micro_wake_word.stop:
            - wait_until:
                condition:
                  not:
                    micro_wake_word.is_running:
                timeout: 3s
            - delay: 200ms
            - if:
                condition:
                  lambda: 'return id(assist_left_ma_group);'
                then:
                  - sendspin.switch: sendspin_hub
                  - delay: 300ms
            - media_player.play: sendspin_media_player
            - wait_until:
                condition:
                  lambda: 'return id(music_active);'
                timeout: 8s
            - lambda: 'id(assist_left_ma_group) = false;'
            - script.execute: reset_display

  - id: go_assist
    then:
        - if:
            condition:
              not:
                voice_assistant.connected:
            then:
              - lambda: 'id(preset_message) = "HA OFFLINE";'
              - script.execute: show_preset_feedback
              - script.stop: go_assist
        - light.turn_on: screen_backlight
        - lambda: |-
            id(lightTO) = 0;
        - if:
            condition:
              lambda: 'return(id(phase) == 3 || id(phase) == 4);'
            then:
              - if:
                  condition:
                    voice_assistant.is_running:
                  then:
                    - voice_assistant.stop:
                    - wait_until:
                        not:
                          voice_assistant.is_running:
              - if:
                  condition:
                    media_player.is_announcing:
                      id: speaker_media_player
                  then:
                    - media_player.stop:
                        id: speaker_media_player
                        announcement: true
              - if:
                  condition:
                    media_player.is_playing:
                      id: speaker_media_player
                  then:
                    - media_player.stop:
                        id: speaker_media_player
              - micro_wake_word.start:
              - lambda: |-
                  id(mute) = false;
                  id(auto_mute_active) = false;
                  id(phase) = 1;
              - script.execute: reset_display
            else:
              - if:
                  condition:
                    media_player.is_announcing:
                      id: speaker_media_player
                  then:
                    - media_player.stop:
                        id: speaker_media_player
                        announcement: true
              - if:
                  condition:
                    media_player.is_playing:
                      id: speaker_media_player
                  then:
                    - media_player.stop:
                        id: speaker_media_player
              - if:
                  condition:
                    voice_assistant.is_running:
                  then:
                    - voice_assistant.stop:
                    - wait_until:
                        not:
                          voice_assistant.is_running:
              - micro_wake_word.stop:
              - lambda: |-
                  id(phase) = 3;
              - script.execute: reset_display
              - voice_assistant.start:

  - id: mute_unmute
    then:
        - light.turn_on: screen_backlight
        - lambda: |-
            id(lightTO) = 0;
        - if:
            condition:
              lambda: |-
                return !id(assist_return_to_ma) &&
                    (id(music_active) ||
                     id(sendspin_media_player).state == media_player::MEDIA_PLAYER_STATE_PLAYING);
            then:
              # The Sendspin media player controls mute for every member of
              # the current Music Assistant group, not only this Radio.
              - if:
                  condition:
                    media_player.is_muted: sendspin_media_player
                  then:
                    - media_player.unmute: sendspin_media_player
                  else:
                    - media_player.mute: sendspin_media_player
              - script.execute: schedule_music_refresh
            else:
              - if:
                  condition:
                    lambda: 'return id(mute);'
                  then:
                    - logger.log: "unmute!"
                    - media_player.volume_set:
                        id: speaker_media_player
                        volume: !lambda 'return id(Vol);'
                    - lambda: id(mute) = false;
                    - lambda: id(auto_mute_active) = false;
                  else:
                    - logger.log: "mute!"
                    - media_player.volume_set:
                        id: speaker_media_player
                        volume: '0'
                    - lambda: id(mute) = true;
                    - lambda: id(auto_mute_active) = false;
        - lambda: |-
            id(volume_display_active) = true;
            id(volume_display_timer) = 0;
        - script.execute: schedule_volume_update
        - script.execute: reset_display    

  - id: jack_detect_high
    then:
       - logger.log: "Jack detect high -> route to speaker"
       - output.turn_off: dac_mute
       - lambda: |-
           id(my_es8388).write_byte(0x1D, 0x20);
           id(my_es8388).write_byte(0x1C, 0x10);
           id(my_es8388).write_byte(0x04, 0x30);

  - id: jack_detect_low
    then:
       - logger.log: "Jack detect low -> route to line out"
       - output.turn_on: dac_mute
       - lambda: |-
           id(my_es8388).write_byte(0x1D, 0x00);
           id(my_es8388).write_byte(0x1C, 0x00);
           id(my_es8388).write_byte(0x04, 0x0C);

  - id: adjust_volume
    parameters:
      delta: float
    then:
      - light.turn_on: screen_backlight
      - if:
          condition:
            lambda: |-
              return !id(assist_return_to_ma) &&
                  (id(music_active) ||
                   id(sendspin_media_player).state == media_player::MEDIA_PLAYER_STATE_PLAYING);
          then:
            # Use the server's current group volume, including changes made in HA.
            - media_player.volume_set:
                id: sendspin_media_player
                volume: !lambda |-
                  const float current = id(sendspin_media_player).volume;
                  return clamp(current + delta, 0.0f, 1.0f);
            - media_player.unmute: sendspin_media_player
            - lambda: 'id(lightTO) = 0;'
            - script.execute: schedule_music_refresh
            - script.stop: adjust_volume
      - lambda: |-
          id(lightTO) = 0;          
          float scale = 1.0f;
          
          if(id(Vol) < 0.03f) scale = 0.05f;
          else if(id(Vol) < 0.05f) scale = 0.40f;
          else if(id(Vol) < 0.3f) scale = 0.50f;
          else if(id(Vol) < 0.5f) scale = 0.60f;

          id(Vol) += delta * scale;
          if (id(Vol) < 0) id(Vol) = 0;
          if (id(Vol) > 1) id(Vol) = 1;
          id(volume_display_active) = true;
          id(volume_display_timer) = 0;
          id(mute) = false;
          int v = id(Vol) * 100;
          if(id(Vol) < 0.1f)
          {
             id(my_es8388).write_byte(46, 23 + v);
             id(my_es8388).write_byte(47, 23 + v);          
             id(my_es8388).write_byte(48, 23 + v);          
             id(my_es8388).write_byte(49, 23 + v);          
          }
          else
          {
             id(my_es8388).write_byte(46, 33);
             id(my_es8388).write_byte(47, 33);          
             id(my_es8388).write_byte(48, 33);          
             id(my_es8388).write_byte(49, 33);        
           }               
          
      - media_player.volume_set:
          id: speaker_media_player
          volume: !lambda return id(Vol);
      - delay: 200ms
      - script.execute: schedule_volume_update
      - script.execute: reset_display

  - id: schedule_volume_update
#    mode: restart
    then:
#      - delay: 400ms
      - lambda: |-
          if (id(volume_display_active) && id(myDisplay).is_ready()) {
            id(myDisplay).update();
          }

  - id: reset_display
#    mode: restart
    then: 
       - logger.log: "===> reset_display" 
       - lambda: |-
            id(lightTO) = 0;
            if ((id(music_active) ||
                 id(sendspin_media_player).state == media_player::MEDIA_PLAYER_STATE_PLAYING) &&
                !id(assist_return_to_ma)) {
              id(myDisplay).show_page(musicP);
              id(myDisplay).update();
              return;
            }
            if (id(mic_muted)) {
              id(myDisplay).show_page(muteMicP);
              id(myDisplay).update();
              return;
            }

            if ((id(phase) == 0) && (!id(logo).is_running())) {
              id(logo).execute();
            } else if (id(phase) == 1) {
              id(waiting).execute();
            } else if (id(phase) == 2) {
              id(external_player).execute();
            } else if (id(phase) == 3) {
              id(listening).execute();
            } else if (id(phase) == 4) {
              id(answering).execute();
            }

  - id: logo
    then:
       - logger.log: "===> logo"
       - media_player.speaker.play_on_device_media_file:
           id: speaker_media_player
           media_file: little_sound
           announcement: false
       - lambda: |-
           id(myDisplay).show_page(logoP);
           id(myDisplay).update();
           id(lightTO) = 0;
       - light.turn_on: screen_backlight
       - delay: 8sec
       - script.execute: wait_for_wifi_ready

  - id: wait_for_wifi_ready
    mode: restart
    then:
       - logger.log: "Waiting for WiFi before entering waiting state"
       - while:
           condition:
             not:
               wifi.connected:
           then:
             - lambda: |-
                 id(myDisplay).show_page(wifiWaitingP);
                 id(myDisplay).update();
                 id(lightTO) = 0;
             - light.turn_on: screen_backlight
             - delay: 1s
       - logger.log: "WiFi connected, moving to waiting state"
       - lambda: 'id(phase) = 1;'
       - script.execute: reset_display

  - id: update_playback_mode
    mode: restart
    then:
      - if:
          condition:
            lambda: 'return id(music_active);'
          then:
            - script.stop: enter_idle_mode
            - script.execute: mute_off
            - micro_wake_word.stop:
            - if:
                condition:
                  lambda: 'return !id(assist_return_to_ma);'
                then:
                  - lambda: 'id(phase) = 5;'
                  - script.execute: reset_display
          else:
            - script.execute: enter_idle_mode

  - id: enter_idle_mode
    mode: restart
    then:
      # A station change briefly stops the local source while MA remains
      # PLAYING. Do not open the microphone during that transition.
      - delay: 1200ms
      - wait_until:
          condition:
            lambda: 'return id(radio_speaker).is_stopped();'
          timeout: 4s
      - if:
          condition:
            lambda: |-
              return !id(music_active) && !id(assist_return_to_ma) &&
                  id(sendspin_media_player).state != media_player::MEDIA_PLAYER_STATE_PLAYING &&
                  id(radio_speaker).is_stopped();
          then:
            - lambda: 'id(phase) = 1;'
            - script.execute: reset_display

  - id: waiting
    mode: restart
    then:
               - if:
                   condition:
                         voice_assistant.is_running:
                   then:
                      - delay: 1s
                      - voice_assistant.stop:
               - script.execute: mute_on
               - if:
                   condition:
                     and:
                       - lambda: |-
                           return !id(music_active) && !id(mic_muted) &&
                               id(sendspin_media_player).state != media_player::MEDIA_PLAYER_STATE_PLAYING &&
                               id(radio_speaker).is_stopped();
                       - not:
                           micro_wake_word.is_running:
                   then:
                     - micro_wake_word.start:
               - logger.log: "===> wakeword"
               - lambda: |-
                   id(myDisplay).show_page(waitingP);
                   id(myDisplay).update();
                   id(lightTO) = 0;
               - light.turn_on: screen_backlight


  - id: listening
    mode: restart
    then:
       - logger.log: "===> listening"
       - script.execute: mute_on
       - lambda: |-
            id(myDisplay).show_page(listeningP);
            id(myDisplay).update();
            id(lightTO) = 0;

       - light.turn_on: screen_backlight


  - id: answering
    mode: restart
    then:
       - logger.log: "===> answering"
       - script.execute: mute_off
       - lambda: |-
            id(myDisplay).show_page(answeringP);
            id(myDisplay).update();
            id(lightTO) = 0;
       - light.turn_on: screen_backlight
       - delay: 10s




  - id: external_player
    mode: restart
    then:
       - logger.log: "===> front end player"
#       - script.execute: mute_off
       - lambda: |-
            id(myDisplay).show_page(waitingBP);
            id(myDisplay).update();
            id(lightTO) = 0;
       - light.turn_on: screen_backlight

  - id: mute_on
    then:
      - if:
          condition:
            lambda: 'return !id(auto_mute_active);'
          then:
            - media_player.volume_set:
                id: speaker_media_player
                volume: '0'
      - lambda: |-
          id(mute) = true;
          id(auto_mute_active) = true;
          id(volume_display_active) = true;
          id(volume_display_timer) = 0;
      - script.execute: schedule_volume_update

  - id: mute_off
    then:
      - if:
          condition:
            lambda: 'return id(auto_mute_active);'
          then:
            - media_player.volume_set:
                id: speaker_media_player
                volume: !lambda return(id(Vol));
      - lambda: |-
          id(mute) = false;
          id(auto_mute_active) = false;
          id(volume_display_active) = true;
          id(volume_display_timer) = 0;
      - script.execute: schedule_volume_update
      
     
      
      
      
      
      
