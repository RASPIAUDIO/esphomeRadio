    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    turn_off_action:
      - if:
          condition:
            lambda: return id(ui_cue_kind) == 2;
          then:
            - script.execute: stop_ui_cue
  - platform: template
    id: mic_mute_switch
    name: Microphone Mute
    icon: mdi:microphone-off
    entity_category: config
    lambda: return id(mic_muted);
    turn_on_action:
      - microphone.mute: radio_mic
      - lambda: id(mic_muted) = true;
      - script.execute: stop_ui_cue
      - if:
          condition:
            voice_assistant.is_running:
          then:
            - voice_assistant.stop:
      - micro_wake_word.stop:
      - script.execute: reset_display
    turn_off_action:
      # A brief cue mute must not be released before the acoustic tail is gone.
      - lambda: id(radio_mic).set_mute_state(id(ui_cue_kind) != 0);
      - lambda: id(mic_muted) = false;
      - script.execute: aec_rearm_wake_word
      - script.execute: reset_display
