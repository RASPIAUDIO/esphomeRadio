# Complete Assist and Music Assistant screens, including volume and battery.

display:
  - id: myDisplay
    platform: ili9xxx
    spi_id: spi_bus0
    # Avoid allocating an internal DMA copy of the PSRAM framebuffer while BLE runs.
    psram_dma: true
    model: ST7789V
    cs_pin: GPIO40
    dc_pin: GPIO39
    reset_pin: GPIO9
    invert_colors: true
    rotation: 90
    update_interval: never
    auto_clear_enabled: false
    pages:
      - id: presetP
        lambda: id(ui_render).execute();
      - id: musicP
        lambda: id(ui_render).execute();
      - id: logoP
        lambda: |-
          it.image(0, 0, id(raspiIm));
          auto draw_volume_bar = [&]() {
            if (!id(volume_display_active)) {
              return;
            }
            float display_volume = id(Vol);
            if (id(mute) || id(auto_mute_active)) {
              display_volume = 0.0f;
            }
            if (display_volume < 0.0f) {
              display_volume = 0.0f;
            }
            if (display_volume > 1.0f) {
              display_volume = 1.0f;
            }
            const int gauge_height = 18;
            const int margin = 3;
            const int display_width = it.get_width();
            const int display_height = it.get_height();
            if (display_width <= margin * 2 || display_height <= gauge_height) {
              return;
            }
            const int gauge_y = display_height - gauge_height;
            const int inner_width = display_width - margin * 2;
            const int inner_height = gauge_height - margin * 2;
            int filled_width = static_cast<int>(inner_width * display_volume + 0.5f);
            if (filled_width > inner_width) {
              filled_width = inner_width;
            } else if (filled_width < 0) {
              filled_width = 0;
            }
            it.filled_rectangle(0, gauge_y, display_width, gauge_height, id(bg_charcoal));
            if (inner_height > 0) {
              if (filled_width > 0) {
                auto bar_color = id(volume_display_active) ? id(lime) : id(light_blue);
                it.filled_rectangle(margin, gauge_y + margin, filled_width, inner_height, bar_color);
              }
              it.rectangle(margin, gauge_y + margin, inner_width, inner_height, id(black));
            }
          };
          draw_volume_bar();
      - id: wifiWaitingP
        lambda: id(ui_render).execute();
      - id: waitingP
        lambda: id(ui_render).execute();
      - id: waitingBP
        lambda: id(ui_render).execute();
      - id: listeningP
        lambda: id(ui_render).execute();
      - id: answeringP
        lambda: id(ui_render).execute();
      - id: muteMicP
        lambda: id(ui_render).execute();

sensor:
  - platform: sendspin
    id: ma_media_duration
    type: track_duration
    internal: true
    on_value:
      - script.execute: schedule_music_refresh
  - platform: rotary_encoder
    name: Volume
    id: volume_encoder
    pin_a:
      number: GPIO42
      mode:
        input: true
        pullup: true
    pin_b:
      number: GPIO3
      mode:
        input: true
        pullup: true
    on_anticlockwise:
      then:
        - script.execute:
            id: adjust_volume
            delta: -0.05
    on_clockwise:
      then:
        - script.execute:
            id: adjust_volume
            delta: 0.05
  - platform: rotary_encoder
    name: Dummy
    id: function_encoder
    pin_a:
      number: GPIO7
      mode:
        input: true
        pullup: true
    pin_b:
      number: GPIO6
      mode:
        input: true
        pullup: true
    on_anticlockwise:
      then:
        - light.turn_on: screen_backlight
        - lambda: id(lightTO) = 0;
    on_clockwise:
      then:
        - light.turn_on: screen_backlight
        - lambda: id(lightTO) = 0;
  - platform: adc
    id: button_adc
    pin: GPIO1
    attenuation: auto
    update_interval: .1s
    on_value_range:
      - above: 3.0
        then:
          - binary_sensor.template.publish:
              id: btn_confirm
              state: false
          - binary_sensor.template.publish:
              id: btn_1
              state: false
          - binary_sensor.template.publish:
              id: btn_2
              state: false
          - binary_sensor.template.publish:
              id: btn_3
              state: false
      - above: 0.41
        below: 0.45
        then:
          - binary_sensor.template.publish:
              id: btn_3
              state: true
      - above: 0.8
        below: 0.84
        then:
          - binary_sensor.template.publish:
              id: btn_confirm
              state: true
      - above: 1.5
        below: 1.61
        then:
          - binary_sensor.template.publish:
              id: btn_1
              state: true
      - above: 1.98
        below: 2.03
        then:
          - binary_sensor.template.publish:
              id: btn_2
              state: true
  - platform: adc
    pin: GPIO13
    name: Battery voltage
    device_class: voltage
    unit_of_measurement: V
    accuracy_decimals: 2
    state_class: measurement
    entity_category: diagnostic
    update_interval: 15s
    attenuation: auto
    filters:
      - multiply: 2
      - calibrate_linear:
          - 0.0 -> 0.0
          - 4.58 -> 4.20
      - exponential_moving_average:
          alpha: 0.2
          send_every: 2
      - delta: 0.002
    on_value:
      then:
        - sensor.template.publish:
            id: battery_percent
            state: !lambda |-
              return x ;
        - lambda: |-
            if (id(myDisplay).is_ready()) {
              id(myDisplay).update();
            }
  - platform: template
    name: Battery
    id: battery_percent
    device_class: battery
    unit_of_measurement: '%'
    accuracy_decimals: 0
    state_class: measurement
    entity_category: diagnostic
    update_interval: 15s
    filters:
      - calibrate_polynomial:
          degree: 3
          datapoints:
            - 4.20 -> 100.0
            - 4.13 -> 97.1
            - 4.10 -> 94.2
            - 4.07 -> 88.4
            - 4.05 -> 82.7
            - 4.04 -> 76.9
            - 4.04 -> 71.1
            - 4.01 -> 65.3
            - 3.99 -> 59.5
            - 3.95 -> 53.8
            - 3.93 -> 48.0
            - 3.91 -> 42.2
            - 3.88 -> 36.4
            - 3.86 -> 30.6
            - 3.84 -> 24.9
            - 3.82 -> 19.1
            - 3.76 -> 13.3
            - 3.73 -> 10.4
            - 3.70 -> 7.5
            - 3.64 -> 4.6
            - 3.50 -> 1.7
            - 3.00 -> 0.0
      - lambda: return clamp(x, 0.0f, 100.0f);
  - platform: wifi_signal
    name: WiFi Signal
    id: wifi_signal_dbm
    update_interval: 15s
    on_value:
      then:
        - lambda: |-
            if (id(myDisplay).is_ready()) {
              id(myDisplay).update();
            }
  - platform: debug
