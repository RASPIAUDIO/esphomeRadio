# Home Assistant Components
sensor:
  - platform: sendspin
    id: ma_media_duration
    type: track_duration
    internal: true
    on_value:
      - script.execute: schedule_music_refresh
  - platform: rotary_encoder
    name: "Volume"
    id: volume_encoder
    pin_a:
      number: GPIO42
      mode:
        input: true
        pullup: true
    pin_b:
      number: GPIO3
      mode:
        input: true
        pullup: true
    on_anticlockwise:
      then:
#        - delay: 400ms
        - script.execute:
            id: adjust_volume
            delta: -0.05
    on_clockwise:
      then:
#        - delay: 400ms
        - script.execute:
            id: adjust_volume
            delta: 0.05
  - platform: rotary_encoder
    name: "Dummy"
    id: function_encoder
    pin_a:
      number: GPIO7
      mode:
        input: true
        pullup: true
    pin_b:
      number: GPIO6
      mode:
        input: true
        pullup: true
    on_anticlockwise:
      then:
        - light.turn_on: screen_backlight
        - lambda: |-
                id(lightTO) = 0;

    on_clockwise:
      then:
        - light.turn_on: screen_backlight
        - lambda: |-
                id(lightTO) = 0;
  - platform: adc
    id: button_adc
    pin: GPIO1
    attenuation: auto
    update_interval: .1s
    on_value_range:
      - above: 3.0
        then:
          - binary_sensor.template.publish:
              id: btn_confirm
              state: OFF
          - binary_sensor.template.publish:
              id: btn_1
              state: OFF
          - binary_sensor.template.publish:
              id: btn_2
              state: OFF
          - binary_sensor.template.publish:
              id: btn_3
              state: OFF
      - above: 0.41
        below: 0.45
        then:
          - binary_sensor.template.publish:
              id: btn_3
              state: ON
      - above: 0.8
        below: 0.84
        then:
          - binary_sensor.template.publish:
              id: btn_confirm
              state: ON
      - above: 1.50
        below: 1.61
        then:
          - binary_sensor.template.publish:
              id: btn_1
              state: ON
      - above: 1.98
        below: 2.03
        then:
          - binary_sensor.template.publish:
              id: btn_2
              state: ON
  - platform: adc
    pin: GPIO13
    name: Battery voltage
    device_class: voltage
    unit_of_measurement: "V"
    accuracy_decimals: 2
    state_class: measurement
    entity_category: diagnostic
    update_interval: 15s
    attenuation: auto
    filters:
      - multiply: 2
      - calibrate_linear:
          - 0.0 -> 0.0
          # Map measured full charge to real value to compensate divider/ADC bias
          - 4.58 -> 4.20
      - exponential_moving_average:
             alpha: 0.2
             send_every: 2
      - delta: 0.002
    on_value:
        then:
          - sensor.template.publish:
              id: battery_percent
              state: !lambda "return x ;"
          - lambda: |-
              if (id(myDisplay).is_ready()) {
                id(myDisplay).update();
              }
  - platform: template
    name: Battery
    id: battery_percent
    device_class: battery
    unit_of_measurement: "%"
    accuracy_decimals: 0
    state_class: measurement
    entity_category: diagnostic
    update_interval: 15s
    filters:
      - calibrate_polynomial:
           degree: 3
           datapoints:
               - 4.20 -> 100.0
               - 4.13 -> 97.1
               - 4.10 -> 94.2
               - 4.07 -> 88.4
               - 4.05 -> 82.7
               - 4.04 -> 76.9
               - 4.04 -> 71.1
               - 4.01 -> 65.3
               - 3.99 -> 59.5
               - 3.95 -> 53.8
               - 3.93 -> 48.0
               - 3.91 -> 42.2
               - 3.88 -> 36.4
               - 3.86 -> 30.6
               - 3.84 -> 24.9
               - 3.82 -> 19.1
               - 3.76 -> 13.3
               - 3.73 -> 10.4
               - 3.70 -> 7.5
               - 3.64 -> 4.6
               - 3.50 -> 1.7
               - 3.00 -> 0.0
      - lambda: return clamp(x, 0.0f, 100.0f);   
  - platform: wifi_signal
    name: WiFi Signal
    id: wifi_signal_dbm
    update_interval: 15s
    on_value:
      then:
        - lambda: |-
            if (id(myDisplay).is_ready()) {
              id(myDisplay).update();
            }


binary_sensor:
  - platform: gpio
    pin:
      number: GPIO21
      mode:
        input: true
#        pullup: true
    id: usb_power_detect
    name: USB Power
    device_class: power
    entity_category: diagnostic
    on_press:
      - logger.log: "USB power detected"
      - lambda: |-
          if (id(myDisplay).is_ready()) {
            id(myDisplay).update();
          }
    on_release:
      - logger.log: "USB power removed"
      - lambda: |-
          if (id(myDisplay).is_ready()) {
            id(myDisplay).update();
          }
  - platform: gpio
    pin:
      number: GPIO10
      mode:
        input: true
        pullup: true
    id: jack_detect
    name: Jack Detect
    internal: true
    on_press:
      - script.execute: jack_detect_high
    on_release:
      - script.execute: jack_detect_low
  - platform: gpio
    pin:
      number: GPIO48
      inverted: true
      mode:
        input: true
        pullup: true
    id: click_vol
    name: Mute
#    disabled_by_default: true
    on_press:
      then:
        - script.execute: mute_unmute

  - platform: gpio
    pin:
      number: GPIO45
      inverted: true
      mode:
        input: true
        pullup: true
    id: click_sta
    name: Assist
    on_click:
       - min_length: 50ms
         max_length: 2s
         then:
          - if:
              condition:
                lambda: |-
                  return id(music_active) || id(assist_return_to_ma) ||
                      id(sendspin_media_player).state == media_player::MEDIA_PLAYER_STATE_PLAYING;
              then:
                - script.execute: temporary_assist
              else:
                - script.execute: go_assist


