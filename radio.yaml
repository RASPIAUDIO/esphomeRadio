# Full controls and transitions, including group pause/resume and AEC output ownership.

number:
  - platform: template
    id: ui_sound_volume
    name: Sound volume
    icon: mdi:volume-medium
    entity_category: config
    unit_of_measurement: "%"
    mode: slider
    min_value: 0
    max_value: 100
    step: 5
    initial_value: 35
    optimistic: true
    restore_value: true
    on_value:
      - if:
          condition:
            lambda: return id(ui_cue_kind) != 0;
          then:
            - script.execute: aec_sync_output

script:
  - id: check_ready_sound
    then:
      - if:
          condition:
            and:
              - wifi.connected:
              - voice_assistant.connected:
              - lambda: |-
                  return !id(ble_provisioning_active) && id(phase) != 0 &&
                      !id(ui_ready_sound_checked);
          then:
            # Once per boot, even if disabled or skipped because playback began.
            - lambda: id(ui_ready_sound_checked) = true;
            - script.execute:
                id: play_ui_cue
                kind: 1

  - id: stop_ui_cue
    then:
      - if:
          condition:
            lambda: return id(ui_cue_kind) != 0;
          then:
            - script.execute: release_ui_cue
            - script.execute: aec_sync_output
            - script.execute: aec_rearm_wake_word

  - id: release_ui_cue
    then:
      - script.stop: play_ui_cue
      - lambda: |-
          id(ui_cue_input).stop();
          id(ui_cue_kind) = 0;
          // Preserve the user's microphone mute; never change the HA switch.
          id(radio_mic).set_mute_state(id(mic_muted));
          ESP_LOGI("ui_sound", "Cue cancelled; microphone restored");

  - id: play_ui_cue
    mode: single
    parameters:
      kind: int
    then:
      - if:
          condition:
            lambda: |-
                // Never interrupt an answer/announcement, unmute a user-muted
                // output, or play the boot melody over resumed MA music.
                const bool music = id(music_active) ||
                    id(sendspin_media_player).state == media_player::MEDIA_PLAYER_STATE_PLAYING;
                return (kind != 1 && kind != 2) || id(ble_provisioning_active) ||
                    id(va).get_api_connection() == nullptr || !wifi::global_wifi_component->is_connected() ||
                    id(speaker_media_player).state == media_player::MEDIA_PLAYER_STATE_ANNOUNCING ||
                    id(speaker_media_player).is_muted() || (id(mute) && !id(auto_mute_active)) ||
                    !std::isfinite(id(ui_sound_volume).state) || id(ui_sound_volume).state <= 0 ||
                    (music && !id(assist_return_to_ma)) ||
                    (kind == 1 && (!id(startup_sound_enabled).state || id(va).is_running())) ||
                    (kind == 2 && (!id(listening_sound_enabled).state || id(mic_muted) ||
                                  !id(va).is_running() || id(phase) != 3));
          then:
            - script.stop: play_ui_cue
      - if:
          condition:
            lambda: |-
                // UI_CUE_WAV_BEGIN
                // Reject an incompatible replacement before touching the mic.
                // The offline preparation tool emits exactly this WAV layout.
                const auto *clip = kind == 1 ? id(ui_ready_clip) : id(ui_listening_clip);
                if (clip == nullptr || clip->data == nullptr || clip->length < 46) return true;
                const auto *p = clip->data;
                auto u16 = [&](size_t i) -> uint16_t { return uint16_t(p[i]) | (uint16_t(p[i + 1]) << 8); };
                auto u32 = [&](size_t i) -> uint32_t {
                  return uint32_t(p[i]) | (uint32_t(p[i + 1]) << 8) |
                      (uint32_t(p[i + 2]) << 16) | (uint32_t(p[i + 3]) << 24);
                };
                const uint32_t bytes = u32(40);
                return memcmp(p, "RIFF", 4) != 0 || memcmp(p + 8, "WAVEfmt ", 8) != 0 ||
                    u32(4) != clip->length - 8 || u32(16) != 16 || u16(20) != 1 ||
                    u16(22) != 1 || u32(24) != 48000 || u32(28) != 96000 ||
                    u16(32) != 2 || u16(34) != 16 || memcmp(p + 36, "data", 4) != 0 ||
                    bytes != clip->length - 44 || bytes == 0 || (bytes % 2) != 0 ||
                    bytes > (kind == 1 ? 288000U : 192000U);
                // UI_CUE_WAV_END
          then:
            - logger.log:
                level: WARN
                format: "UI sound skipped: expected prepared PCM16/mono/48k WAV"
            - script.stop: play_ui_cue
      - lambda: |-
          id(ui_cue_kind) = kind;
          id(ui_cue_frame) = 0;
          const auto *clip = kind == 1 ? id(ui_ready_clip) : id(ui_listening_clip);
          id(ui_cue_total_frames) = (clip->length - 44) / 2;
          id(ui_cue_started_ms) = millis();
          // The pinned microphone backend sends zero samples while muted,
          // keeping HA's audio stream alive without transcribing our own cue.
          id(radio_mic).set_mute_state(true);
          id(ui_cue_input).set_audio_stream_info(audio::AudioStreamInfo(16, 1, 48000));
          id(ui_cue_input).start();
          ESP_LOGI("ui_sound", "%s cue started (%lu ms)", kind == 1 ? "start.wav" : "blup.wav",
                   static_cast<unsigned long>(id(ui_cue_total_frames) / 48));
      - micro_wake_word.stop:
      - script.execute: aec_sync_output
      - while:
          condition:
            lambda: |-
                return id(ui_cue_kind) != 0 &&
                    id(ui_cue_frame) < id(ui_cue_total_frames) &&
                    millis() - id(ui_cue_started_ms) < (id(ui_cue_kind) == 1 ? 4000U : 2500U);
          then:
            - lambda: |-
                // UI_CUE_PCM_BEGIN
                // Refill up to the entire 250 ms source reserve from flash.
                // A 5 ms automation delay is NOT a real-time scheduling promise:
                // limiting writes to 10 ms starves audio when other work is slow.
                // play(..., 0) accepts only available space, without blocking;
                // no full-clip RAM copy, decoder or extra audio task is needed.
                const uint32_t total = id(ui_cue_total_frames);
                if (id(ui_cue_frame) >= total) return;
                const auto *clip = id(ui_cue_kind) == 1 ? id(ui_ready_clip) : id(ui_listening_clip);
                const uint32_t count = std::min<uint32_t>(12000U, total - id(ui_cue_frame));
                const size_t accepted = id(ui_cue_input).play(
                    clip->data + 44 + id(ui_cue_frame) * 2, count * sizeof(int16_t), 0);
                id(ui_cue_frame) += accepted / sizeof(int16_t);
                // UI_CUE_PCM_END
            - delay: 5ms
      - lambda: |-
          ESP_LOGI("ui_sound", "Queued %lu/%lu frames in %lu ms (clip %lu ms)",
                   static_cast<unsigned long>(id(ui_cue_frame)),
                   static_cast<unsigned long>(id(ui_cue_total_frames)),
                   static_cast<unsigned long>(millis() - id(ui_cue_started_ms)),
                   static_cast<unsigned long>(id(ui_cue_total_frames) / 48));
          if (id(ui_cue_frame) < id(ui_cue_total_frames))
            ESP_LOGW("ui_sound", "Cue producer timed out; releasing audio/microphone");
          id(ui_cue_input).finish();
      - wait_until:
          condition:
            lambda: return id(ui_cue_input).is_stopped();
          timeout: 750ms
      # Short room/codec tail; never alter the user-facing microphone switch.
      - delay: 60ms
      - lambda: |-
          id(ui_cue_input).stop();
          id(ui_cue_kind) = 0;
          id(radio_mic).set_mute_state(id(mic_muted));
          ESP_LOGI("ui_sound", "Cue completed in %lu ms; microphone restored",
                   static_cast<unsigned long>(millis() - id(ui_cue_started_ms)));
      - script.execute: aec_sync_output
      - script.execute: aec_rearm_wake_word

  # Sparse event diagnostics only: no transcript, audio data, timer or retry.
  - id: assist_trace
    parameters:
      event: std::string
    then:
      - lambda: |-
          ESP_LOGI("assist_trace", "%s; uptime_ms=%lu phase=%d running=%s return_ma=%s",
                   event.c_str(), static_cast<unsigned long>(millis()), id(phase),
                   id(va).is_running() ? "YES" : "NO",
                   id(assist_return_to_ma) ? "YES" : "NO");
  - id: ui_begin_assist_display
    then:
      - lambda: |-
          id(ui_thinking) = false;
          id(text_request).publish_state("");
          id(text_response).publish_state("");
  - id: ui_mark_thinking
    then:
      - lambda: |-
          if (!id(va).is_running() || id(myDisplay).get_active_page() != id(listeningP)) return;
          id(ui_thinking) = true;
          if (id(myDisplay).is_ready()) id(myDisplay).update();
  - id: ui_render
    then:
      - lambda: |-
          // One renderer shared by all non-logo pages; display-only, no audio actions.
          auto &it = *id(myDisplay);
          const int w = it.get_width();
          const int h = it.get_height();
          const auto *page = it.get_active_page();
          const bool music = page == id(musicP);
          const bool waiting = page == id(waitingP);
          const bool connecting = page == id(wifiWaitingP) ||
              (waiting && (!wifi::global_wifi_component->is_connected() || id(va).get_api_connection() == nullptr));
          const Color background = connecting ? id(ui_connection_bg) : music ? id(ui_music_bg) : id(ui_assist_bg);
          const Color ink = id(ui_text);
          const Color secondary = id(ui_secondary);
          const Color accent = id(ui_accent);
          it.fill(background);  // Clear missing metadata and previous questions on every redraw.
          
          // UI_TEXT_HELPERS_BEGIN
          auto valid = [](const std::string &s) -> bool {
            return !s.empty() && s != "unknown" && s != "unavailable" && s != "None";
          };
          auto text_width = [&](display::BaseFont *font, const std::string &s) -> int {
            int x1, y1, width, height;
            it.get_text_bounds(0, 0, s.c_str(), font, TextAlign::TOP_LEFT, &x1, &y1, &width, &height);
            return width;
          };
          auto pop_utf8 = [](std::string &s) {
            if (s.empty()) return;
            size_t end = s.size() - 1;
            while (end > 0 && (static_cast<unsigned char>(s[end]) & 0xC0) == 0x80) --end;
            s.resize(end);
          };
          auto fit_text = [&](display::BaseFont *font, std::string s, int width) -> std::string {
            // Scan only the visible prefix, not every suffix of a long transcript.
            std::string prefix;
            size_t pos = 0;
            while (pos < s.size() && pos < 512 && s[pos] != '\n' && s[pos] != '\r') {
              size_t next = pos + 1;
              while (next < s.size() && (static_cast<unsigned char>(s[next]) & 0xC0) == 0x80) ++next;
              const auto candidate = prefix + s.substr(pos, next - pos);
              if (text_width(font, candidate) > width) break;
              prefix = candidate;
              pos = next;
            }
            if (pos == s.size()) return prefix;
            while (!prefix.empty() && text_width(font, prefix + "...") > width) pop_utf8(prefix);
            return text_width(font, "...") <= width ? prefix + "..." : "";
          };
          auto wrap_text = [&](display::BaseFont *font, const std::string &text, int width, size_t limit) {
            std::vector<std::string> lines;
            lines.reserve(limit);
            size_t pos = 0;
            auto space = [](char c) { return c == ' ' || c == '\t' || c == '\r' || c == '\n'; };
            while (pos < text.size() && lines.size() < limit) {
              while (pos < text.size() && space(text[pos])) ++pos;
              if (pos == text.size()) break;
              const size_t start = pos;
              size_t end = start, last_space = std::string::npos;
              while (end < text.size() && text[end] != '\n' && text[end] != '\r') {
                size_t next = end + 1;
                while (next < text.size() && (static_cast<unsigned char>(text[next]) & 0xC0) == 0x80) ++next;
                const std::string candidate = text.substr(start, next - start);
                if (text_width(font, candidate) > width) break;
                if (text[end] == ' ' || text[end] == '\t') last_space = end;
                end = next;
              }
              if (end == start) {
                // Even an oversized/unsupported glyph must make forward progress.
                pos = end + 1;
                while (pos < text.size() && (static_cast<unsigned char>(text[pos]) & 0xC0) == 0x80) ++pos;
                lines.emplace_back("?");
                continue;
              }
              const bool soft_break = end < text.size() && text[end] != '\n' && text[end] != '\r';
              if (soft_break && last_space != std::string::npos && last_space > start) end = last_space;
              std::string line = text.substr(start, end - start);
              while (!line.empty() && space(line.back())) line.pop_back();
              pos = end;
              while (pos < text.size() && space(text[pos])) ++pos;
              if (lines.size() + 1 == limit && pos < text.size()) {
                while (!line.empty() && text_width(font, line + "...") > width) pop_utf8(line);
                line += "...";
              }
              lines.push_back(line);
            }
            return lines;
          };
          // UI_TEXT_HELPERS_END
          
          // Small outline pictograms made from display primitives (no bitmap downloads).
          // 0 Wi-Fi, 1 home, 2 mic, 3 listening, 4 thinking, 5 speaker, 6 radio, 7 mic off.
          auto icon = [&](int kind, int x, int y, int size, Color color) {
            auto line = [&](int x1, int y1, int x2, int y2) {
              it.line(x + x1 * size / 16, y + y1 * size / 16,
                      x + x2 * size / 16, y + y2 * size / 16, color);
            };
            if (kind == 0) {
              line(1, 5, 4, 3); line(4, 3, 12, 3); line(12, 3, 15, 5);
              line(3, 8, 6, 6); line(6, 6, 10, 6); line(10, 6, 13, 8);
              line(6, 10, 8, 9); line(8, 9, 10, 10); line(8, 12, 8, 13);
            } else if (kind == 1) {
              line(1, 7, 8, 1); line(8, 1, 15, 7); line(3, 6, 3, 14);
              line(3, 14, 13, 14); line(13, 14, 13, 6);
              line(6, 14, 6, 9); line(6, 9, 10, 9); line(10, 9, 10, 14);
            } else if (kind == 2 || kind == 7) {
              line(6, 1, 10, 1); line(6, 1, 5, 3); line(10, 1, 11, 3);
              line(5, 3, 5, 8); line(11, 3, 11, 8); line(5, 8, 6, 10);
              line(6, 10, 10, 10); line(10, 10, 11, 8);
              line(2, 6, 2, 9); line(2, 9, 5, 12); line(5, 12, 11, 12);
              line(11, 12, 14, 9); line(14, 9, 14, 6);
              line(8, 12, 8, 15); line(5, 15, 11, 15);
              if (kind == 7) line(0, 0, 16, 16);
            } else if (kind == 3) {
              line(2, 6, 2, 10); line(5, 3, 5, 13); line(8, 1, 8, 15);
              line(11, 4, 11, 12); line(14, 6, 14, 10);
            } else if (kind == 4) {
              for (int cx = 3; cx <= 13; cx += 5) it.filled_circle(x + cx * size / 16, y + size / 2, 1, color);
            } else if (kind == 5) {
              line(1, 6, 4, 6); line(4, 6, 8, 2); line(8, 2, 8, 14);
              line(8, 14, 4, 10); line(4, 10, 1, 10); line(1, 10, 1, 6);
              line(11, 5, 13, 8); line(13, 8, 11, 11);
              line(13, 2, 16, 8); line(16, 8, 13, 14);
            } else {
              line(2, 5, 14, 5); line(14, 5, 14, 14); line(14, 14, 2, 14); line(2, 14, 2, 5);
              line(3, 5, 12, 1); line(5, 8, 5, 11); line(4, 9, 6, 9);
              line(9, 8, 12, 8); line(9, 11, 12, 11);
            }
          };
          auto header = [&](const std::string &label, int symbol) {
            icon(symbol, 16, 12, 16, accent);
            const auto text = fit_text(id(ma_font_status), label, w - 60);
            it.print(42, 11, id(ma_font_status), accent, TextAlign::TOP_LEFT, text.c_str());
          };
          auto title = [&](const std::string &text, int y = 112) {
            display::BaseFont *font = id(ui_font_primary);
            if (text_width(font, text) > w - 32) font = id(ma_font_heading);
            const auto fitted = fit_text(font, text, w - 32);
            it.print(16, y, font, ink, TextAlign::TOP_LEFT, fitted.c_str());
          };
          auto subtitle = [&](const std::string &text, int y = 150) {
            const auto fitted = fit_text(id(font_response), text, w - 32);
            it.print(16, y, id(font_response), secondary, TextAlign::TOP_LEFT, fitted.c_str());
          };
          
          if (connecting) {
            const bool wifi_ok = wifi::global_wifi_component->is_connected();
            header(id(ble_provisioning_active) ? "WI-FI SETUP" : "CONNECTION", wifi_ok ? 1 : 0);
            icon(wifi_ok ? 1 : 0, 16, 72, 24, accent);
            if (id(ble_provisioning_active)) {
              const auto state = id(radio_improv).get_improv_state();
              title(wifi_ok ? "Finishing setup..." : state == improv::STATE_PROVISIONING ?
                    "Connecting to Wi-Fi" : state == improv::STATE_AUTHORIZED ? "Ready for Home Assistant" : "Starting Bluetooth...");
              subtitle("Improv BLE / USB / Wi-Fi AP");
              subtitle("Audio starts after setup", 175);
            } else {
              title(wifi_ok ? "Home Assistant" : "Connecting to Wi-Fi");
              subtitle(wifi_ok ? "Connecting to Assist..." : "Joining your network...");
            }
          } else if (music) {
            // Keep the validated radio/track metadata selection, including absent fields.
            const std::string track = valid(id(ma_media_title).state) ? id(ma_media_title).state : "";
            const std::string artist = valid(id(ma_media_artist).state) ? id(ma_media_artist).state : "";
            const std::string album = valid(id(ma_media_album).state) ? id(ma_media_album).state : "";
            const float duration_ms = id(ma_media_duration).state;
            const bool is_radio = !std::isfinite(duration_ms) || duration_ms <= 500.0f;
            std::string main_text, sub, detail, heading = "MUSIC ASSISTANT";
            if (is_radio) {
              main_text = album.empty() ? track : album;
              sub = album.empty() || track == album ? "" : track;
              detail = artist;
            } else {
              heading = album.empty() ? heading : album;
              main_text = artist.empty() ? track : artist;
              sub = artist.empty() ? "" : track;
              const int seconds = int(duration_ms / 1000.0f + 0.5f);
              char duration[24];
              snprintf(duration, sizeof(duration), "%d:%02d", seconds / 60, seconds % 60);
              detail = duration;
            }
            header(heading, 6);
            display::BaseFont *font = id(ma_font_station);
            if (text_width(font, main_text) > w - 32) font = id(ma_font_heading);
            main_text = fit_text(font, main_text, w - 32);
            it.print(16, 78, font, ink, TextAlign::TOP_LEFT, main_text.c_str());
            sub = fit_text(id(ma_font_metadata), sub, w - 32);
            it.print(16, 121, id(ma_font_metadata), secondary, TextAlign::TOP_LEFT, sub.c_str());
            subtitle(detail, 151);
          } else if (page == id(answeringP)) {
            header("ANSWERING", 5);
            const auto question = valid(id(text_request).state) ? fit_text(id(font_request), id(text_request).state, w - 32) : "";
            it.print(16, 48, id(font_request), secondary, TextAlign::TOP_LEFT, question.c_str());
            const auto response = valid(id(text_response).state) ? id(text_response).state : "";
            const auto lines = wrap_text(id(font_response), response, w - 32, 6);
            // Fixed 20px line spacing leaves the bottom status strip completely free.
            it.start_clipping(16, 72, w - 16, h - 43);
            for (size_t i = 0; i < lines.size(); ++i) {
              it.print(16, 73 + int(i) * 20, id(font_response), ink, TextAlign::TOP_LEFT, lines[i].c_str());
            }
            it.end_clipping();
          } else if (page == id(listeningP)) {
            const bool thinking = id(ui_thinking);
            header(thinking ? "THINKING" : "LISTENING", thinking ? 4 : 2);
            icon(thinking ? 4 : 3, 16, 72, 24, accent);
            if (thinking) {
              if (valid(id(text_request).state)) subtitle(id(text_request).state, 110);
              title("One moment...", 144);
            } else {
              it.print(16, 110, id(ma_font_station), ink, TextAlign::TOP_LEFT, "I'm listening");
              subtitle("Go ahead...", 154);
            }
          } else if (page == id(muteMicP)) {
            header("VOICE ASSIST", 7);
            icon(7, 16, 72, 24, id(ui_warning));
            title("Microphone off");
            subtitle("Wake word unavailable");
          } else if (page == id(presetP)) {
            header("RADIO PRESETS", 6);
            const auto lines = wrap_text(id(ma_font_heading), id(preset_message), w - 32, 3);
            for (size_t i = 0; i < lines.size(); ++i)
              it.print(16, 84 + int(i) * 29, id(ma_font_heading), ink, TextAlign::TOP_LEFT, lines[i].c_str());
          } else if (page == id(waitingBP)) {
            header("VOICE AUDIO", 5);
            icon(5, 16, 72, 24, accent);
            title("Playing audio");
          } else {
            header("VOICE ASSIST", 2);
            icon(2, 16, 72, 24, accent);
            std::string wake_word;
            int enabled = 0;
            for (auto *model : {id(okay_nabu), id(hey_jarvis), id(hey_mycroft)}) {
              if (model->is_enabled()) { wake_word = model->get_wake_word(); ++enabled; }
            }
            title(enabled == 1 ? "Say \"" + wake_word + "\"" : enabled > 1 ? "Ready for wake word" : "Press Assist");
            if (enabled > 0) subtitle("or press Assist");
          }
          
          // Persistent footer: show the selected logical volume, not the temporary
          // hardware mute during listening. Never write volume/codec state from drawing.
          it.line(16, h - 42, w - 16, h - 42, id(ui_separator));
          if (connecting) {
            it.print(16, h - 28, id(ma_font_status), secondary, TextAlign::TOP_LEFT,
                     wifi::global_wifi_component->is_connected() ? "WI-FI CONNECTED" : "WI-FI CONNECTING");
          } else {
            const bool show_music = music || (page == id(presetP) && id(music_active) && !id(assist_return_to_ma));
            const float volume = show_music ? id(sendspin_media_player).volume : id(Vol);
            const bool muted = show_music ? id(sendspin_media_player).is_muted() :
                id(speaker_media_player).is_muted() || (id(mute) && !id(auto_mute_active));
            const bool known = std::isfinite(volume);
            const int percent = known ? int(clamp(volume, 0.0f, 1.0f) * 100 + 0.5f) : 0;
            char label[32];
            const char *source = show_music ? "MUSIC" : "VOICE";
            if (muted) snprintf(label, sizeof(label), "%s MUTED", source);
            else if (known) snprintf(label, sizeof(label), "%s %d%%", source, percent);
            else snprintf(label, sizeof(label), "%s --", source);
            it.print(16, h - 28, id(ma_font_status), ink, TextAlign::TOP_LEFT, label);
            const int bar_x = 16 + text_width(id(ma_font_status), label) + 9;
            const int bar_width = w - 96 - bar_x;
            if (bar_width > 0) {
              it.filled_rectangle(bar_x, h - 21, bar_width, 5, id(ui_track));
              const int fill = muted || !known ? 0 : bar_width * percent / 100;
              if (fill > 0) it.filled_rectangle(bar_x, h - 21, fill, 5, id(ui_fill));
            }
          }
          const float battery = id(battery_percent).state;
          const int bx = w - 84, by = h - 26;
          it.rectangle(bx, by, 18, 11, ink);
          it.filled_rectangle(bx + 18, by + 3, 2, 5, ink);
          const bool battery_known = id(battery_percent).has_state() && std::isfinite(battery);
          if (battery_known) {
            const int percent = int(clamp(battery, 0.0f, 100.0f) + 0.5f);
            const int fill = 14 * percent / 100;
            const Color color = percent < 20 ? id(ui_warning) : id(ui_fill);
            if (fill > 0) it.filled_rectangle(bx + 2, by + 2, fill, 7, color);
            it.printf(w - 16, h - 28, id(ma_font_status), ink, TextAlign::TOP_RIGHT, "%d%%", percent);
          } else {
            it.print(w - 16, h - 28, id(ma_font_status), secondary, TextAlign::TOP_RIGHT, "--%");
          }
          if (id(usb_power_detect).state) {
            // A small + above the battery retains the charging indication without crowding.
            it.line(bx + 6, by - 4, bx + 12, by - 4, ink);
            it.line(bx + 9, by - 7, bx + 9, by - 1, ink);
          }

  - id: ble_finish_wifi_setup
    mode: single
    then:
      # Improv keeps its completion result available for 10 seconds.
      # Also covers provisioning through USB or the fallback access point.
      - delay: 12s
      - if:
          condition:
            not:
              wifi.connected:
          then:
            - script.stop: ble_finish_wifi_setup
      - lambda: id(radio_improv).stop();
      - ble.disable:
          id: radio_ble
      - wait_until:
          condition:
            lambda: |-
              return esp_bt_controller_get_status() == ESP_BT_CONTROLLER_STATUS_IDLE &&
                  esp_bluedroid_get_status() == ESP_BLUEDROID_STATUS_UNINITIALIZED;
          timeout: 10s
      - if:
          condition:
            lambda: |-
              return esp_bt_controller_get_status() != ESP_BT_CONTROLLER_STATUS_IDLE ||
                  esp_bluedroid_get_status() != ESP_BLUEDROID_STATUS_UNINITIALIZED;
          then:
            - logger.log:
                level: ERROR
                format: "BLE shutdown not confirmed; audio remains held"
            - script.stop: ble_finish_wifi_setup
      - lambda: |-
          id(radio_improv).disable_loop();
          id(ble_provisioning_active) = false;
          api::global_api_server->enable_loop();
          id(sendspin_hub).enable_loop();
          ESP_LOGI("radio_ble", "BLE stopped; audio released; internal free=%u largest=%u",
                   unsigned(heap_caps_get_free_size(MALLOC_CAP_INTERNAL | MALLOC_CAP_8BIT)),
                   unsigned(heap_caps_get_largest_free_block(MALLOC_CAP_INTERNAL | MALLOC_CAP_8BIT)));
      # wait_for_wifi_ready now resumes the existing idle/wake-word workflow.
  - id: show_preset_feedback
    mode: restart
    then:
      - light.turn_on:
          id: screen_backlight
          brightness: 100%
      - lambda: |-
          id(lightTO) = 0;
          if (id(myDisplay).is_ready()) {
            id(myDisplay).show_page(presetP);
            id(myDisplay).update();
          }
      - delay: 2500ms
      - script.execute: reset_display
  - id: play_radio_preset
    mode: restart
    parameters:
      station: string
    then:
      - if:
          condition:
            lambda: return station.find_first_not_of(" \t\r\n") != std::string::npos;
          then:
            - homeassistant.action:
                action: media_player.play_media
                data:
                  media_content_type: radio
                  enqueue: replace
                data_template:
                  entity_id: |-
                    {% set configured = player_entity | trim %} {% if configured and states(configured) not in ['unknown', 'unavailable']
                          and state_attr(configured, 'mass_player_type') is not none %}
                      {{ configured }}
                    {% else %}
                      {% set ns = namespace(entity_id='') %}
                      {% for player in states.media_player %}
                        {% set label = (player.entity_id ~ ' ' ~ player.name) | lower %}
                        {% if ns.entity_id == '' and player.attributes.mass_player_type is defined
                              and 'radio' in label %}
                          {% set ns.entity_id = player.entity_id %}
                        {% endif %}
                      {% endfor %}
                      {{ ns.entity_id }}
                    {% endif %}
                  media_content_id: '{{ station_name }}'
                variables:
                  station_name: !lambda |-
                    return station;
                  player_entity: !lambda |-
                    return id(ma_player_entity_id);
                on_error:
                  - lambda: |-
                      id(preset_message) = "PLAY FAILED";
                      ESP_LOGW("radio_preset", "Unable to play station: %s", error.c_str());
                  - script.execute: show_preset_feedback
          else:
            - lambda: id(preset_message) = "NO RADIO";
            - script.execute: show_preset_feedback
  - id: save_radio_preset
    mode: restart
    parameters:
      preset: int
    then:
      - light.turn_on:
          id: screen_backlight
          brightness: 100%
      - homeassistant.action:
          action: music_assistant.get_queue
          data_template:
            entity_id: |-
              {% set configured = player_entity | trim %} {% if configured and states(configured) not in ['unknown', 'unavailable']
                    and state_attr(configured, 'mass_player_type') is not none %}
                {{ configured }}
              {% else %}
                {% set ns = namespace(named='', metadata='') %}
                {% for player in states.media_player %}
                  {% if player.attributes.mass_player_type is defined
                        and player.state not in ['unknown', 'unavailable'] %}
                    {% set label = (player.entity_id ~ ' ' ~ player.name) | lower %}
                    {% set same_album = current_album | length > 0
                          and player.attributes.media_album_name | default('') == current_album %}
                    {% set same_title = current_title | length > 0
                          and player.attributes.media_title | default('') == current_title %}
                    {% if ns.named == '' and 'radio' in label %}
                      {% set ns.named = player.entity_id %}
                    {% endif %}
                    {% if ns.metadata == '' and (same_album or same_title) %}
                      {% set ns.metadata = player.entity_id %}
                    {% endif %}
                  {% endif %}
                {% endfor %}
                {{ ns.named if ns.named else ns.metadata }}
              {% endif %}
          variables:
            player_entity: !lambda |-
              return id(ma_player_entity_id);
            current_title: !lambda |-
              return id(ma_media_title).state;
            current_album: !lambda |-
              return id(ma_media_album).state;
          capture_response: true
          response_template: '{% set entity_id = response.keys() | list | first | default('''') %}{% set item = response[entity_id].get(''current_item'') if entity_id else none %}{% set media_item = item.get(''media_item'') if item else none %}{% set uri = state_attr(entity_id, ''media_content_id'') or (media_item.get(''uri'', '''') if media_item else '''') %}{{ entity_id }}|@|{{ uri }}'
          on_success:
            - lambda: |-
                const std::string payload = response["response"].as<std::string>();
                const size_t separator = payload.find("|@|");
                const std::string entity_id = separator == std::string::npos
                    ? "" : payload.substr(0, separator);
                const std::string uri = separator == std::string::npos
                    ? "" : payload.substr(separator + 3);
                const bool valid = !entity_id.empty() && !uri.empty() &&
                                   uri.find("://") != std::string::npos;
                if (!valid) {
                  id(preset_message) = "NO RADIO";
                  ESP_LOGW("radio_preset", "No usable station in MA response: %s", payload.c_str());
                  return;
                }
                if (uri.size() > 255) {
                  id(preset_message) = "URI TOO LONG";
                  ESP_LOGW("radio_preset", "Station URI exceeds the 255-byte preset limit");
                  return;
                }

                text::Text *target = nullptr;
                if (preset == 1) target = id(radio_station_1);
                else if (preset == 2) target = id(radio_station_2);
                else if (preset == 3) target = id(radio_station_3);
                else if (preset == 4) target = id(radio_station_4);
                if (target == nullptr) return;

                id(ma_player_entity_id) = entity_id;
                auto call = target->make_call();
                call.set_value(uri);
                call.perform();
                id(preset_message) = "MEMO " + std::to_string(preset) + " OK";
                ESP_LOGI("radio_preset", "Station stored on button %d via %s",
                         preset, entity_id.c_str());
            - script.execute: show_preset_feedback
          on_error:
            - lambda: |-
                id(preset_message) = "NO RADIO";
                ESP_LOGW("radio_preset", "Unable to read MA queue: %s", error.c_str());
            - script.execute: show_preset_feedback
  - id: schedule_music_refresh
    mode: restart
    then:
      - delay: 200ms
      - if:
          condition:
            lambda: return id(music_active) && !id(assist_return_to_ma) && id(myDisplay).is_ready();
          then:
            - component.update: myDisplay
  - id: temporary_assist
    mode: single
    then:
      - script.execute:
          id: assist_trace
          event: !lambda |-
            return id(assist_return_to_ma) ? "Control cancels MA Assist" :
                id(aec_pending_wake_word).empty() ? "Control starts MA Assist" : "Wake word starts MA Assist";
      - if:
          condition:
            lambda: return id(ble_provisioning_active);
          then:
            - script.execute: reset_display
            - script.stop: temporary_assist
      - if:
          condition:
            not:
              voice_assistant.connected:
          then:
            - lambda: |-
                id(aec_pending_wake_word).clear();
                id(preset_message) = "HA OFFLINE";
            - script.execute: show_preset_feedback
            - script.execute: aec_rearm_wake_word
            - script.stop: temporary_assist
      - if:
          condition:
            lambda: return id(assist_return_to_ma);
          then:
            - voice_assistant.stop:
            - media_player.stop:
                id: speaker_media_player
                announcement: true
            - script.execute: finish_temporary_assist
          else:
            - lambda: |-
                id(assist_return_to_ma) = true;
                id(assist_left_ma_group) = false;
                id(phase) = 3;
            - micro_wake_word.stop:
            - media_player.pause: sendspin_media_player
            - wait_until:
                condition:
                  lambda: |-
                    return id(sendspin_media_player).state !=
                        media_player::MEDIA_PLAYER_STATE_PLAYING;
                timeout: 8s
            - delay: 750ms
            - if:
                condition:
                  and:
                    - voice_assistant.connected:
                    - lambda: |-
                        return !id(mic_muted) &&
                            id(sendspin_media_player).state != media_player::MEDIA_PLAYER_STATE_PLAYING;
                then:
                  - logger.log:
                      level: INFO
                      format: MA group paused; starting Assist on duplex I2S
                  - light.turn_on: screen_backlight
                  - script.execute: reset_display
                  - voice_assistant.start:
                      wake_word: !lambda |-
                        return id(aec_pending_wake_word);
                      silence_detection: true
                  - lambda: id(aec_pending_wake_word).clear();
                else:
                  - logger.log:
                      level: WARN
                      format: 'AEC Assist cancelled: group pause, HA connection or microphone unavailable'
                  - script.execute: finish_temporary_assist
  - id: finish_temporary_assist
    mode: single
    then:
      - script.execute:
          id: assist_trace
          event: MA return requested
      - wait_until:
          condition:
            and:
              - not:
                  voice_assistant.is_running:
              - not:
                  media_player.is_announcing: speaker_media_player
          timeout: 15s
      - if:
          condition:
            or:
              - voice_assistant.is_running:
              - media_player.is_announcing: speaker_media_player
          then:
            - logger.log:
                level: WARN
                format: AEC music return still waiting for Assist/announcement completion
            - script.stop: finish_temporary_assist
      - if:
          condition:
            lambda: return id(assist_return_to_ma);
          then:
            - script.execute:
                id: assist_trace
                event: Resuming MA playback
            - media_player.play: sendspin_media_player
            - wait_until:
                condition:
                  lambda: |-
                    return id(music_active) ||
                        id(sendspin_media_player).state == media_player::MEDIA_PLAYER_STATE_PLAYING;
                timeout: 8s
            - delay: 750ms
            - lambda: |-
                id(assist_return_to_ma) = false;
                id(assist_left_ma_group) = false;
                id(aec_pending_wake_word).clear();
            - script.execute: update_playback_mode
            - script.execute: aec_rearm_wake_word
            - script.execute: reset_display
  - id: go_assist
    then:
      - if:
          condition:
            lambda: return id(ble_provisioning_active);
          then:
            - script.execute: reset_display
            - script.stop: go_assist
      - if:
          condition:
            not:
              voice_assistant.connected:
          then:
            - lambda: id(preset_message) = "HA OFFLINE";
            - script.execute: show_preset_feedback
            - script.stop: go_assist
      - light.turn_on: screen_backlight
      - lambda: id(lightTO) = 0;
      - if:
          condition:
            lambda: return(id(phase) == 3 || id(phase) == 4);
          then:
            - if:
                condition:
                  voice_assistant.is_running:
                then:
                  - voice_assistant.stop:
                  - wait_until:
                      not:
                        voice_assistant.is_running:
            - if:
                condition:
                  media_player.is_announcing:
                    id: speaker_media_player
                then:
                  - media_player.stop:
                      id: speaker_media_player
                      announcement: true
            - if:
                condition:
                  media_player.is_playing:
                    id: speaker_media_player
                then:
                  - media_player.stop:
                      id: speaker_media_player
            - micro_wake_word.start:
            - lambda: |-
                id(mute) = false;
                id(auto_mute_active) = false;
                id(phase) = 1;
            - script.execute: reset_display
          else:
            - if:
                condition:
                  media_player.is_announcing:
                    id: speaker_media_player
                then:
                  - media_player.stop:
                      id: speaker_media_player
                      announcement: true
            - if:
                condition:
                  media_player.is_playing:
                    id: speaker_media_player
                then:
                  - media_player.stop:
                      id: speaker_media_player
            - if:
                condition:
                  voice_assistant.is_running:
                then:
                  - voice_assistant.stop:
                  - wait_until:
                      not:
                        voice_assistant.is_running:
            - micro_wake_word.stop:
            - lambda: id(phase) = 3;
            - script.execute: reset_display
            - voice_assistant.start:
  - id: mute_unmute
    then:
      - script.execute: stop_ui_cue
      - light.turn_on: screen_backlight
      - lambda: id(lightTO) = 0;
      - if:
          condition:
            lambda: |-
              return !id(assist_return_to_ma) &&
                  (id(music_active) ||
                   id(sendspin_media_player).state == media_player::MEDIA_PLAYER_STATE_PLAYING);
          then:
            - if:
                condition:
                  media_player.is_muted: sendspin_media_player
                then:
                  - media_player.unmute: sendspin_media_player
                else:
                  - media_player.mute: sendspin_media_player
            - script.execute: schedule_music_refresh
          else:
            - if:
                condition:
                  lambda: return id(mute);
                then:
                  - logger.log: unmute!
                  - script.execute: apply_local_codec_volume
                  - media_player.volume_set:
                      id: speaker_media_player
                      volume: !lambda |-
                        return id(Vol);
                  - lambda: id(mute) = false;
                  - lambda: id(auto_mute_active) = false;
                else:
                  - logger.log: mute!
                  - media_player.volume_set:
                      id: speaker_media_player
                      volume: '0'
                  - lambda: id(mute) = true;
                  - lambda: id(auto_mute_active) = false;
      - lambda: |-
          id(volume_display_active) = true;
          id(volume_display_timer) = 0;
      - script.execute: schedule_volume_update
      - script.execute: reset_display
  - id: jack_detect_high
    then:
      - logger.log: Jack detect high -> route to speaker
      - output.turn_off: dac_mute
      - lambda: |-
          id(my_es8388).write_byte(0x1D, 0x20);
          id(my_es8388).write_byte(0x1C, 0x10);
          id(my_es8388).write_byte(0x04, 0x30);
  - id: jack_detect_low
    then:
      - logger.log: Jack detect low -> route to line out
      - output.turn_on: dac_mute
      - lambda: |-
          id(my_es8388).write_byte(0x1D, 0x00);
          id(my_es8388).write_byte(0x1C, 0x00);
          id(my_es8388).write_byte(0x04, 0x0C);
  - id: adjust_volume
    parameters:
      delta: float
    then:
      - light.turn_on: screen_backlight
      - if:
          condition:
            lambda: |-
              return !id(assist_return_to_ma) &&
                  (id(music_active) ||
                   id(sendspin_media_player).state == media_player::MEDIA_PLAYER_STATE_PLAYING);
          then:
            - media_player.volume_set:
                id: sendspin_media_player
                volume: !lambda |-
                  const float reported = id(sendspin_media_player).volume;
                  int current = std::isfinite(reported)
                      ? static_cast<int>(std::roundf(clamp(reported, 0.0f, 1.0f) * 100.0f))
                      : 0;
                  const uint32_t now = millis();
                  if (id(ma_volume_target_percent) >= 0 &&
                      now - id(ma_volume_last_command_ms) < 700) {
                    current = id(ma_volume_target_percent);
                  }
                  // About 1% per encoder event below 20%; keep 5% above it.
                  // Stop at the boundary instead of jumping across it.
                  int step = static_cast<int>(std::roundf(delta *
                      (current <= 20 ? 20.0f : 100.0f)));
                  int next = current + step;
                  if (step < 0 && current > 20 && next < 20)
                    next = 20;
                  next = clamp(next, 0, 100);
                  id(ma_volume_target_percent) = next;
                  id(ma_volume_last_command_ms) = now;
                  return next / 100.0f;
            - media_player.unmute: sendspin_media_player
            - lambda: id(lightTO) = 0;
            - script.execute: schedule_music_refresh
            - script.stop: adjust_volume
      - lambda: |-
          id(lightTO) = 0;          
          float scale = 1.0f;

          if(id(Vol) <= 0.20f) scale = 0.20f;
          else if(id(Vol) < 0.3f) scale = 0.50f;
          else if(id(Vol) < 0.5f) scale = 0.60f;

          const float current = id(Vol);
          id(Vol) += delta * scale;
          if (delta < 0.0f && current > 0.20f && id(Vol) < 0.20f)
            id(Vol) = 0.20f;
          if (id(Vol) < 0) id(Vol) = 0;
          if (id(Vol) > 1) id(Vol) = 1;
          id(volume_display_active) = true;
          id(volume_display_timer) = 0;
          id(mute) = false;
      - script.execute: apply_local_codec_volume
      - media_player.volume_set:
          id: speaker_media_player
          volume: !lambda |-
            return id(Vol);
      - script.execute: schedule_volume_update
      - script.execute: reset_display
  - id: schedule_volume_update
    then:
      - lambda: |-
          if (id(volume_display_active) && id(myDisplay).is_ready()) {
            id(myDisplay).update();
          }
  - id: apply_local_codec_volume
    then:
      - lambda: |-
          const int percent = static_cast<int>(std::roundf(clamp(id(Vol), 0.0f, 1.0f) * 100.0f));
          const uint8_t codec_volume = id(Vol) < 0.10f ? 23 + percent : 33;
          for (uint8_t reg = 0x2E; reg <= 0x31; reg++) {
            id(my_es8388).write_byte(reg, codec_volume);
          }
  - id: refresh_assist_waiting_display
    then:
      - lambda: |-
          // Display only: never run waiting/reset_display (they also mute audio).
          // Leave music, listening, answers, feedback and backlight timeout alone.
          if (id(myDisplay).is_ready() && id(myDisplay).get_active_page() == id(waitingP)) {
            id(myDisplay).update();
          }
  - id: reset_display
    then:
      - logger.log: ===> reset_display
      - lambda: |-
          id(lightTO) = 0;
          if (id(ble_provisioning_active)) {
            id(myDisplay).show_page(wifiWaitingP);
            id(myDisplay).update();
            if (!id(wait_for_wifi_ready).is_running()) id(wait_for_wifi_ready).execute();
            return;
          }
          if ((id(music_active) ||
               id(sendspin_media_player).state == media_player::MEDIA_PLAYER_STATE_PLAYING) &&
              !id(assist_return_to_ma)) {
            id(myDisplay).show_page(musicP);
            id(myDisplay).update();
            return;
          }
          if (id(mic_muted)) {
            id(myDisplay).show_page(muteMicP);
            id(myDisplay).update();
            return;
          }

          if ((id(phase) == 0) && (!id(logo).is_running())) {
            id(logo).execute();
          } else if (id(phase) == 1) {
            id(waiting).execute();
          } else if (id(phase) == 2) {
            id(external_player).execute();
          } else if (id(phase) == 3) {
            id(listening).execute();
          } else if (id(phase) == 4) {
            id(answering).execute();
          }
  - id: logo
    then:
      - logger.log: ===> logo
      - if:
          condition:
            lambda: return id(ble_provisioning_active);
          then:
            - script.execute: wait_for_wifi_ready
            - script.stop: logo
      # The startup melody is now played only when Wi-Fi AND HA voice are ready.
      - lambda: |-
          id(myDisplay).show_page(logoP);
          id(myDisplay).update();
          id(lightTO) = 0;
      - light.turn_on: screen_backlight
      - delay: 8sec
      - script.execute: wait_for_wifi_ready
  - id: wait_for_wifi_ready
    mode: restart
    then:
      - logger.log: Waiting for WiFi and BLE shutdown before audio
      - while:
          condition:
            lambda: return !wifi::global_wifi_component->is_connected() || id(ble_provisioning_active);
          then:
            - lambda: |-
                id(myDisplay).show_page(wifiWaitingP);
                id(myDisplay).update();
                id(lightTO) = 0;
            - light.turn_on: screen_backlight
            - delay: 1s
      - logger.log: WiFi connected, moving to waiting state
      - lambda: id(phase) = 1;
      - script.execute: reset_display
  - id: update_playback_mode
    mode: restart
    then:
      - if:
          condition:
            lambda: |-
              return id(music_active) ||
                  id(sendspin_media_player).state == media_player::MEDIA_PLAYER_STATE_PLAYING;
          then:
            - script.stop: enter_idle_mode
            - if:
                condition:
                  lambda: return !id(assist_return_to_ma);
                then:
                  - lambda: id(phase) = 5;
                  - script.execute: aec_sync_output
                  - script.execute: aec_rearm_wake_word
                  - script.execute: reset_display
          else:
            - script.execute: enter_idle_mode
  - id: enter_idle_mode
    mode: restart
    then:
      - delay: 1200ms
      - if:
          condition:
            and:
              - lambda: |-
                  return !id(music_active) && !id(assist_return_to_ma) &&
                      !id(va).is_running() &&
                      id(sendspin_media_player).state != media_player::MEDIA_PLAYER_STATE_PLAYING;
              - not:
                  media_player.is_announcing: speaker_media_player
          then:
            - lambda: id(phase) = 1;
            - script.execute: reset_display
  - id: waiting
    mode: restart
    then:
      - script.execute: mute_on
      - script.execute: aec_rearm_wake_word
      - logger.log: ===> wakeword (duplex)
      - lambda: |-
          id(myDisplay).show_page(waitingP);
          id(myDisplay).update();
          id(lightTO) = 0;
      - light.turn_on: screen_backlight
  - id: listening
    mode: restart
    then:
      - script.execute: ui_begin_assist_display
      - logger.log: ===> listening
      - script.execute: mute_on
      - lambda: |-
          id(myDisplay).show_page(listeningP);
          id(myDisplay).update();
          id(lightTO) = 0;
      - light.turn_on: screen_backlight
  - id: answering
    mode: restart
    then:
      - logger.log: ===> answering
      - script.execute: mute_off
      - lambda: |-
          id(myDisplay).show_page(answeringP);
          id(myDisplay).update();
          id(lightTO) = 0;
      - light.turn_on: screen_backlight
      - delay: 10s
  - id: external_player
    mode: restart
    then:
      - logger.log: ===> front end player
      - lambda: |-
          id(myDisplay).show_page(waitingBP);
          id(myDisplay).update();
          id(lightTO) = 0;
      - light.turn_on: screen_backlight
  - id: mute_on
    then:
      - lambda: |-
          id(radio_speaker).set_mute_state(true);
          id(mute) = true;
          id(auto_mute_active) = true;
          id(volume_display_active) = true;
          id(volume_display_timer) = 0;
      - script.execute: schedule_volume_update
      - if:
          condition:
            lambda: return id(ui_cue_kind) != 0;
          then:
            - script.execute: aec_sync_output
  - id: mute_off
    then:
      - lambda: |-
          id(mute) = false;
          id(auto_mute_active) = false;
          id(volume_display_active) = true;
          id(volume_display_timer) = 0;
      - script.execute: aec_sync_output
      - script.execute: schedule_volume_update
  - id: aec_tune_wake_word_task
    then:
      - lambda: |-
          // ESPHome 2026.9 creates the inference worker as "mww" at priority 3.
          // Let it run ahead of the HTTP/UI workloads, but below duplex I2S
          // (19). Reapply after each start; the component deletes its own task
          // from the main loop, so do not cache a handle across restarts.
          if (!id(mww).is_running()) return;
          const TaskHandle_t task = xTaskGetHandle("mww");
          if (task == nullptr) return;  // Never change the calling task's priority.
          if (uxTaskPriorityGet(task) < 6) {
            vTaskPrioritySet(task, 6);
            ESP_LOGI("radio_audio", "Wake-word worker priority raised to 6");
          }
  - id: aec_sync_output
    then:
      - if:
          condition:
            lambda: |-
                return id(ui_cue_kind) != 0 &&
                    (id(speaker_media_player).is_muted() ||
                     (id(mute) && !id(auto_mute_active)) ||
                     (!id(assist_return_to_ma) &&
                      (id(music_active) ||
                       id(sendspin_media_player).state == media_player::MEDIA_PLAYER_STATE_PLAYING)));
          then:
            # No recursive aec_sync_output call; restore normal routing below.
            - script.execute: release_ui_cue
            - script.execute: aec_rearm_wake_word
      - if:
          condition:
            lambda: return id(ui_cue_kind) != 0;
          then:
            - lambda: |-
                // Temporary hardware level only: no Vol/MA/entity writes.
                for (uint8_t reg = 0x2E; reg <= 0x31; reg++)
                  id(my_es8388).write_byte(reg, 0x21);
                const float level = id(ui_sound_volume).state;
                id(radio_speaker).set_volume(std::isfinite(level) ? clamp(level / 100.0f, 0.0f, 1.0f) : 0.0f);
                id(radio_speaker).set_mute_state(false);
            - script.stop: aec_sync_output
      - if:
          condition:
            and:
              - lambda: |-
                  return !id(assist_return_to_ma) &&
                      (id(music_active) ||
                       id(sendspin_media_player).state == media_player::MEDIA_PLAYER_STATE_PLAYING);
              - not:
                  voice_assistant.is_running:
              - not:
                  media_player.is_announcing: speaker_media_player
          then:
            - lambda: |-
                const float volume = id(sendspin_media_player).volume;
                if (std::isfinite(volume))
                  id(radio_speaker).set_volume(clamp(volume, 0.0f, 1.0f));
                // set_volume alone does not clear a previous physical mute.
                // Use MA's actual mute state, never unmute a user-muted group.
                id(radio_speaker).set_mute_state(id(sendspin_media_player).is_muted());
                for (uint8_t reg = 0x2E; reg <= 0x31; reg++)
                  id(my_es8388).write_byte(reg, 0x21);
                id(mute) = false;
                id(auto_mute_active) = false;
          else:
            - script.execute: apply_local_codec_volume
            - lambda: |-
                id(radio_speaker).set_volume(clamp(id(Vol), 0.0f, 1.0f));
                id(radio_speaker).set_mute_state(
                    id(auto_mute_active) || id(speaker_media_player).is_muted());
  - id: apply_radio_microphone_input
    parameters:
      input: string
    then:
      - lambda: |-
          // ES8388 datasheet rev. 5, ADC Control 2/3:
          // DSSEL=1, DSL=0. DSR selects input pair 1/2 for the right ADC.
          // MONOMIX[4:3]=10 mixes both PGAs into the right ADC, retaining
          // the existing mono/right I2S path and single-channel AEC.
          const uint8_t inputs = input == "Left" ? 0xF8 : 0xFC;
          const uint8_t mix = input == "Both" ? 0x12 : 0x02;
          bool ok = id(my_es8388).write_byte(0x0A, inputs);
          ok &= id(my_es8388).write_byte(0x0B, mix);
          uint8_t actual_inputs = 0, actual_mix = 0;
          ok &= id(my_es8388).read_byte(0x0A, &actual_inputs);
          ok &= id(my_es8388).read_byte(0x0B, &actual_mix);
          if (!ok || actual_inputs != inputs || actual_mix != mix) {
            ESP_LOGE("radio_codec", "Microphone routing was not confirmed");
          } else {
            ESP_LOGI("radio_codec", "Microphone input: %s (ADC2=0x%02X ADC3=0x%02X)",
                     input.c_str(), actual_inputs, actual_mix);
          }
  - id: apply_radio_codec_routing
    then:
      - script.execute:
          id: apply_radio_microphone_input
          input: !lambda return id(microphone_input).current_option().str();
      - lambda: |-
          bool ok = true;
          ok &= id(my_es8388).write_byte(0x0E, 0x30);  // ADC high-pass filter
          ok &= id(my_es8388).write_byte(0x16, 0x03);  // ADC noise gate
          if (!ok) ESP_LOGE("radio_codec", "Failed to apply Radio microphone routing");
      - if:
          condition:
            binary_sensor.is_on: jack_detect
          then:
            - script.execute: jack_detect_high
          else:
            - script.execute: jack_detect_low
      - if:
          condition:
            lambda: |-
              return !id(assist_return_to_ma) &&
                  (id(music_active) ||
                   id(sendspin_media_player).state == media_player::MEDIA_PLAYER_STATE_PLAYING);
          then:
            - lambda: |-
                for (uint8_t reg = 0x2E; reg <= 0x31; reg++)
                  id(my_es8388).write_byte(reg, 0x21);
          else:
            - script.execute: apply_local_codec_volume
      - logger.log:
          level: INFO
          format: Radio codec routing reapplied after duplex codec open
  - id: aec_rearm_wake_word
    then:
      - if:
          condition:
            and:
              - lambda: return !id(ble_provisioning_active) && !id(mic_muted) && !id(assist_return_to_ma) && id(ui_cue_kind) == 0;
              - not:
                  voice_assistant.is_running:
              - not:
                  media_player.is_announcing: speaker_media_player
              - not:
                  micro_wake_word.is_running:
          then:
            - micro_wake_word.start:

esp_aec:
  id: aec
  sample_rate: 16000
  mode: sr_low_cost
  filter_length: 4

# Duplex I2S and codec configuration validated on the Radio.

esp_audio_stack:
  id: audio_stack
  sample_rate: 48000
  output_sample_rate: 16000
  bits_per_sample: 16
  slot_bit_width: 16
  num_channels: 2
  speaker_channels: 2
  rx_slot_mode: mono
  mic_channel: right
  processor_id: aec
  aec_reference: ring_buffer
  aec_reference_buffer_ms: 80
  task_core: 1
  # Move only the non-DMA processing buffers to PSRAM (~15 KiB internal RAM saved).
  # Keep I2S DMA, the audio task stack and wake-word stack in their original memory.
  # This leaves more internal RAM for ESPHome's 8192-byte update-check task.
  buffers_in_psram: true
  i2s_mclk_pin: GPIO0
  i2s_bclk_pin: GPIO5
  i2s_lrclk_pin: GPIO16
  i2s_din_pin: GPIO4
  i2s_dout_pin: GPIO17
  on_start:
    - script.execute: apply_radio_codec_routing
  codec:
    i2c_id: codec_bus
    input:
      type: es8388
      address: 16
      gain_db: 18.0
    output:
      type: es8388
      address: 16

button:
  - platform: template
    name: Check firmware update
    entity_category: diagnostic
    on_press:
      - lambda: |-
          ESP_LOGI("radio_update", "Check only: internal free=%u largest=%u; PSRAM free=%u",
                   unsigned(heap_caps_get_free_size(MALLOC_CAP_INTERNAL | MALLOC_CAP_8BIT)),
                   unsigned(heap_caps_get_largest_free_block(MALLOC_CAP_INTERNAL | MALLOC_CAP_8BIT)),
                   unsigned(heap_caps_get_free_size(MALLOC_CAP_SPIRAM | MALLOC_CAP_8BIT)));
      - component.update: update_http_request
  - platform: template
    name: Audio Diagnostics
    entity_category: diagnostic
    on_press:
      - esp_audio_stack.dump_diagnostics:
          id: audio_stack
      - lambda: |-
          ESP_LOGI("radio_audio",
                   "Output volume=%.3f mute=%s; MA volume=%.3f mute=%s; voice volume=%.3f mute=%s; auto_mute=%s",
                   id(radio_speaker).get_volume(), id(radio_speaker).get_mute_state() ? "YES" : "NO",
                   id(sendspin_media_player).volume, id(sendspin_media_player).is_muted() ? "YES" : "NO",
                   id(Vol), id(speaker_media_player).is_muted() ? "YES" : "NO",
                   id(auto_mute_active) ? "YES" : "NO");
          ESP_LOGI("radio_ble", "Setup=%s BLE=%s internal free=%u largest=%u",
                   id(ble_provisioning_active) ? "YES" : "NO", id(radio_ble).is_active() ? "ON" : "OFF",
                   unsigned(heap_caps_get_free_size(MALLOC_CAP_INTERNAL | MALLOC_CAP_8BIT)),
                   unsigned(heap_caps_get_largest_free_block(MALLOC_CAP_INTERNAL | MALLOC_CAP_8BIT)));
          nvs_stats_t stats{};
          if (nvs_get_stats("nvs", &stats) == ESP_OK)
            ESP_LOGI("radio_ble", "NVS entries: used=%u free=%u total=%u",
                     unsigned(stats.used_entries), unsigned(stats.free_entries), unsigned(stats.total_entries));
          // Task name/lifetime are verified against ESPHome 2026.9's MWW.
          // Handles are looked up only in the main loop, never retained.
          if (id(mww).is_running()) {
            const TaskHandle_t task = xTaskGetHandle("mww");
            if (task != nullptr)
              ESP_LOGI("radio_audio", "MWW priority=%u core_affinity=%d free_stack=%u",
                       unsigned(uxTaskPriorityGet(task)), int(xTaskGetCoreID(task)),
                       unsigned(uxTaskGetStackHighWaterMark(task)));
          }
  - platform: template
    name: Local Audio Test
    entity_category: diagnostic
    on_press:
      - media_player.speaker.play_on_device_media_file:
          id: speaker_media_player
          media_file: little_sound
          announcement: true

debug:
  update_interval: 30s


