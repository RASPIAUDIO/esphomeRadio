display:
  - id: myDisplay
    platform: ili9xxx
    spi_id: spi_bus0
    model: ST7789V
    cs_pin: GPIO40
    dc_pin: GPIO39
    reset_pin: GPIO9
    invert_colors: true
    rotation: 90
    update_interval: never
    auto_clear_enabled: false
    pages:
        - id: presetP
          lambda: |-
            const int w = it.get_width();
            const int h = it.get_height();
            it.filled_rectangle(0, 0, w, h, id(ma_bg));
            it.filled_rectangle(12, h / 2 - 42, w - 24, 84, id(ma_panel));
            it.rectangle(12, h / 2 - 42, w - 24, 84, id(ma_accent));
            it.printf(w / 2, h / 2, id(ma_font_heading), id(ma_text),
                      TextAlign::CENTER, "%s", id(preset_message).c_str());
        - id: musicP
          lambda: |-
            const int w = it.get_width();
            const int h = it.get_height();
            auto valid = [](const std::string &s) -> bool {
              return !s.empty() && s != "unknown" && s != "unavailable" && s != "None";
            };
            auto text_width = [&](display::BaseFont *font, const std::string &text) -> int {
              int x1, y1, width, height;
              it.get_text_bounds(0, 0, text.c_str(), font, TextAlign::TOP_LEFT,
                                 &x1, &y1, &width, &height);
              return width;
            };
            auto fit_text = [&](display::BaseFont *font, std::string text, int width) -> std::string {
              if (text_width(font, text) <= width) return text;
              // Shorten by whole UTF-8 characters so accented names remain valid.
              while (!text.empty()) {
                size_t end = text.size() - 1;
                while (end > 0 && (static_cast<unsigned char>(text[end]) & 0xC0) == 0x80) --end;
                text.resize(end);
                if (text_width(font, text + "...") <= width) return text + "...";
              }
              return "";
            };

            const std::string title = valid(id(ma_media_title).state) ? id(ma_media_title).state : "";
            const std::string artist = valid(id(ma_media_artist).state) ? id(ma_media_artist).state : "";
            const std::string album = valid(id(ma_media_album).state) ? id(ma_media_album).state : "";
            const float duration_ms = id(ma_media_duration).state;
            // As in RadioMusic, streams without a finite duration are treated as radio.
            const bool is_radio = !std::isfinite(duration_ms) || duration_ms <= 500.0f;
            std::string header = "MUSIC ASSISTANT";
            std::string main_text;
            std::string subtitle;
            std::string detail;
            if (is_radio) {
              main_text = album.empty() ? title : album;
              subtitle = album.empty() || title == album ? "" : title;
              detail = artist;
            } else {
              header = album.empty() ? header : album;
              main_text = artist.empty() ? title : artist;
              subtitle = artist.empty() ? "" : title;
              const int seconds = int(duration_ms / 1000.0f + 0.5f);
              char duration[24];
              snprintf(duration, sizeof(duration), "%d:%02d", seconds / 60, seconds % 60);
              detail = duration;
            }
            display::BaseFont *main_font = id(ma_font_station);
            if (text_width(main_font, main_text) > w - 48) main_font = id(ma_font_heading);
            main_text = fit_text(main_font, main_text, w - 48);
            header = fit_text(id(ma_font_heading), header, w - 32);
            subtitle = fit_text(id(ma_font_metadata), subtitle, w - 48);
            detail = fit_text(id(ma_font_status), detail, w - 48);

            // Event-driven full redraw: clear absent metadata without a scrolling timer.
            it.filled_rectangle(0, 0, w, h, id(ma_bg));
            it.filled_rectangle(0, 0, w, 50, id(ma_header));
            it.filled_rectangle(0, 50, w, 3, id(ma_accent));
            it.filled_rectangle(12, 66, w - 24, 110, id(ma_panel));
            it.rectangle(12, 66, w - 24, 110, id(ma_accent));
            it.filled_rectangle(12, h - 50, w - 24, 40, id(ma_footer));
            it.printf(w / 2, 13, id(ma_font_heading), id(ma_text), TextAlign::TOP_CENTER,
                      "%s", header.c_str());
            it.printf(w / 2, 79, main_font, id(ma_text), TextAlign::TOP_CENTER,
                      "%s", main_text.c_str());
            it.printf(w / 2, 117, id(ma_font_metadata), id(ma_text_muted), TextAlign::TOP_CENTER,
                      "%s", subtitle.c_str());
            it.printf(w / 2, 146, id(ma_font_status), id(ma_text_muted), TextAlign::TOP_CENTER,
                      "%s", detail.c_str());

            const bool muted = id(sendspin_media_player).is_muted();
            const float volume = id(sendspin_media_player).volume;
            const bool volume_known = std::isfinite(volume);
            const int volume_percent = volume_known ? int(clamp(volume, 0.0f, 1.0f) * 100 + 0.5f) : 0;
            if (muted) {
              it.print(24, h - 43, id(ma_font_status), id(ma_accent), "MUTED");
            } else if (volume_known) {
              it.printf(24, h - 43, id(ma_font_status), id(ma_text), "VOL %d%%", volume_percent);
            } else {
              it.print(24, h - 43, id(ma_font_status), id(ma_text_muted), "VOL --");
            }
            const int bar_x = 106;
            const int bar_w = w - 190;
            it.filled_rectangle(bar_x, h - 37, bar_w, 8, id(ma_bar_bg));
            const int filled = muted ? 0 : bar_w * volume_percent / 100;
            if (filled > 0) it.filled_rectangle(bar_x, h - 37, filled, 8, id(ma_bar_fill));
            if (id(usb_power_detect).state) {
              it.print(bar_x + bar_w / 2, h - 23, id(font_wifi_label), id(ma_text_muted),
                       TextAlign::TOP_CENTER, "USB");
            }

            const int battery_x = w - 57;
            const int battery_y = h - 43;
            it.rectangle(battery_x, battery_y, 30, 12, id(ma_text));
            it.filled_rectangle(battery_x + 30, battery_y + 4, 3, 4, id(ma_text));
            it.filled_rectangle(battery_x + 2, battery_y + 2, 26, 8, id(ma_bar_bg));
            const float battery = id(battery_percent).state;
            if (id(battery_percent).has_state() && std::isfinite(battery)) {
              const int percent = int(clamp(battery, 0.0f, 100.0f) + 0.5f);
              const Color battery_color = percent < 20 ? id(ma_battery_low) :
