# Raspiaudio Radio Full AEC + Improv BLE — light UI + sound cues.
# Release 2026.9.7: HTTPS and non-DMA audio buffers use PSRAM to keep
# enough internal memory for firmware update checks during music playback.
# Standalone firmware with user-selected startup and listening recordings.
# Pastel backgrounds, shared event-driven renderer, 16px multi-line voice answers.
# Only the original Raspiaudio logo bitmap is needed from images/.
# Based on AEC4 with Left/Right/Both microphone selection.
# Uses ESPHome's default 8 MiB partition table; no CSV or other YAML is required.
# Keep images/ and sounds/ beside this file; fonts, wake-word models and the pinned audio
# backend are downloaded by ESPHome during the first build.
# ESPHome 2026.9.0 or newer is required. Task-priority tuning was verified with
# 2026.9.0; recheck it when upgrading ESPHome's micro_wake_word implementation.
# Partition layout matches the published Radio firmware (ESPHome 2026.9.0).
# Devices already using this default layout need no partition migration for OTA.
# Earlier AEC/BLE experiments used a custom layout: OTA does not replace it.
# Returning those devices to the default layout requires a planned USB migration;
# back up settings first, as the NVS location changes.

# Keep the existing device identity across firmware updates.

substitutions:
  name: raspiaudio-radio
  friendly_name: Raspiaudio Radio

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  min_version: 2026.9.0
  name_add_mac_suffix: false
  project:
    name: raspiaudio.radio
    version: 2026.9.7
  on_boot:
    - priority: 800
      then:
        - light.turn_off: screen_backlight
        - wait_until:
            condition:
              lambda: return id(myDisplay).is_ready();
            timeout: 3s
        - if:
            condition:
              lambda: return id(myDisplay).is_ready();
            then:
              - lambda: |-
                  id(myDisplay).show_page(logoP);
                  id(myDisplay).update();
              - light.turn_on: screen_backlight
            else:
              - logger.log: Display not ready during boot splash
    - priority: -100
      then:
        # Wi-Fi has loaded its saved credentials, but no normal loop has run yet.
        - lambda: |-
            id(ble_provisioning_active) = !wifi::global_wifi_component->has_sta();
            if (id(ble_provisioning_active)) {
              // No HA commands or MA stream may start audio during BLE setup.
              api::global_api_server->disable_loop();
              id(sendspin_hub).disable_loop();
              id(radio_ble).enable();
              id(radio_improv).start();
              ESP_LOGI("radio_ble", "Wi-Fi setup: BLE enabled; audio services held");
            } else {
              ESP_LOGI("radio_ble", "Saved Wi-Fi found: BLE stays off");
            }
        - output.turn_off: dac_mute
        - light.turn_on:
            id: screen_backlight
            brightness: 100%
        - lambda: |-
            id(lightTO) = 0;
            id(phase) = 0;
        - script.execute: apply_local_codec_volume
        - media_player.volume_set:
            id: speaker_media_player
            volume: !lambda |-
              return id(Vol);
        - script.execute: reset_display
  build_path: build/raspiaudio-radio-aec-sounds1
  includes:
    - <freertos/task.h>
    - <esp_bt.h>
    - <esp_bt_main.h>
    - <esp_heap_caps.h>
    - <nvs_flash.h>

# Radio ESP32-S3: use ESPHome's default partition table for 8 MiB flash.
# Verified with ESPHome 2026.9.0: two 3840 KiB OTA slots and 448 KiB NVS.

esp32:
  board: esp32-s3-devkitc-1
  flash_size: 8MB
  framework:
    type: esp-idf
    sdkconfig_options:
      CONFIG_ESP32S3_DEFAULT_CPU_FREQ_240: y
      CONFIG_ESP32S3_DATA_CACHE_64KB: y
      CONFIG_ESP32S3_DATA_CACHE_LINE_64B: y
      # IDF 5.5.5 supports this on S3, but ESPHome 2026.9.0 only sets it on ESP32.
      # use_psram alone otherwise leaves the Bluedroid host in internal RAM.
      CONFIG_BT_ALLOCATION_FROM_SPIRAM_FIRST: y
      # HTTPS previously failed with MBEDTLS_ERR_SSL_ALLOC_FAILED (-0x7F00).
      # Use the available external RAM without disabling TLS verification.
      CONFIG_MBEDTLS_INTERNAL_MEM_ALLOC: n
      CONFIG_MBEDTLS_EXTERNAL_MEM_ALLOC: y

preferences:
  flash_write_interval: 5s

psram:
  mode: octal
  speed: 80MHz

# Pinned duplex/AEC backend; no legacy ES8388 ESPHome component is required.

external_components:
  - source: github://n-IA-hane/esphome-audio-stack@31b576975cae32379df8a025826e03b58bdd1069
    components:
      - esp_audio_stack
      - esp_aec

api:
  reboot_timeout: 0s

logger:
  level: INFO
  logs:
    sensor: WARN

# First Wi-Fi setup: Improv BLE, Improv Serial or fallback access point.

wifi:
  ap:
    ssid: Raspiaudio-radio-full
    password: '12345678'
    
http_request:
  verify_ssl: true
  timeout: 15s

ota:
  - platform: esphome
    id: ota_esphome
  - platform: http_request
    id: ota_http_request      
update:
  - platform: http_request
    id: update_http_request
    name: Firmware
    source: https://raw.githubusercontent.com/RASPIAUDIO/esphomeRadio/main/manifest_update.json
    update_interval: 6h
    on_update_available:
      - lambda: |-
          ESP_LOGI("radio_update", "Update available: %s -> %s (no automatic installation)",
                   x.current_version.c_str(), x.latest_version.c_str());
    
captive_portal:

improv_serial:

# BLE is never enabled automatically on an already commissioned Radio.
esp32_ble:
  id: radio_ble
  enable_on_boot: false
  use_psram: true
  max_connections: 1

esp32_improv:
  id: radio_improv
  # Initial setup only: Home Assistant can provision without a physical button press.
  authorizer: none

remote_receiver:
  id: ir_receiver
  pin:
    number: GPIO47
    inverted: true
  dump: nec
  on_nec:
    then:
      - if:
          condition:
            lambda: return x.command == 0xBF40;
          then:
            - logger.log: IR volume up
            - script.execute:
                id: adjust_volume
                delta: 0.05
      - if:
          condition:
            lambda: return x.command == 0xB748;
          then:
            - logger.log: IR volume down
            - script.execute:
                id: adjust_volume
                delta: -0.05
      - if:
          condition:
            lambda: return((x.command == 0xFE01) && (x.address == 0xFE01));
          then:
            - logger.log: IR mute
            - script.execute: mute_unmute
      - if:
          condition:
            lambda: return((x.command == 0xF609) && (x.address == 0xFE01));
          then:
            - logger.log: IR ret
            - if:
                condition:
                  lambda: |-
                    return id(music_active) || id(assist_return_to_ma) ||
                        id(sendspin_media_player).state == media_player::MEDIA_PLAYER_STATE_PLAYING;
                then:
                  - script.execute: temporary_assist
                else:
                  - script.execute: go_assist

i2c:
  id: codec_bus
  scl: GPIO11
  sda: GPIO18
  scan: true

i2c_device:
  id: my_es8388
  address: 16

spi:
  - id: spi_bus0
    clk_pin: GPIO12
    mosi_pin: GPIO8
    interface: hardware

microphone:
  - platform: esp_audio_stack
    id: radio_mic

# One physical duplex output shared by voice and Music Assistant.

speaker:
  - platform: esp_audio_stack
    id: radio_speaker
    sample_rate: 48000
    bits_per_sample: 16
    buffer_duration: 500ms
    num_channels: 2
  - platform: mixer
    id: radio_mixer
    output_speaker: radio_speaker
    num_channels: 2
    source_speakers:
      - id: assist_mixer_input
      - id: music_mixer_input
      # Dedicated 48 kHz cue lane: no media-player events and no extra decoder/task.
      - id: ui_cue_input
        # Refill ahead of the shared main loop; a 10 ms trickle can underrun
        # during display/API work even though delay below requests only 5 ms.
        buffer_duration: 250ms
        num_channels: 1
  - platform: resampler
    id: assist_speaker
    output_speaker: assist_mixer_input
    sample_rate: 48000
  - platform: resampler
    id: music_speaker
    output_speaker: music_mixer_input
    sample_rate: 48000

sendspin:
  id: sendspin_hub

media_source:
  - platform: sendspin
    id: sendspin_source
    buffer_size: 2000000

# Canonical 44-byte-header WAV, PCM16 mono 48 kHz, prepared offline.
# Embedded in flash at build time; no network fetch or new decoder at playback.
audio_file:
  - id: ui_ready_clip
    file: sounds/start.wav
  - id: ui_listening_clip
    file: sounds/blup.wav

# Independent logical music and voice volume controls; shared output is routed below.

media_player:
  - platform: speaker
    name: Voice Answer
    id: speaker_media_player
    announcement_pipeline:
      speaker: assist_speaker
      format: WAV
      sample_rate: 48000
      num_channels: 1
    files:
      - id: little_sound
        file: https://github.com/esphome/home-assistant-voice-pe/raw/dev/sounds/timer_finished.flac
    on_announcement:
      - script.execute: stop_ui_cue
      - if:
          condition:
            lambda: return(id(phase) != 2);
          then:
            - lambda: |-
                id(lightTO) = 0;
                if (id(phase) == 1) {
                  id(phase) = 2;
                  id(external_player).execute();
                }
            - if:
                condition:
                  lambda: return id(auto_mute_active);
                then:
                  - script.execute: mute_off
      - micro_wake_word.stop:
    on_idle:
      - wait_until:
          and:
            - not:
                media_player.is_announcing:
                  id: speaker_media_player
            - not:
                voice_assistant.is_running:
      - if:
          condition:
            lambda: return !id(assist_return_to_ma) && id(phase) == 4;
          then:
            - lambda: id(phase) = 1;
            - script.execute: reset_display
      - if:
          condition:
            lambda: return !id(assist_return_to_ma) && id(phase) == 2;
          then:
            - lambda: id(phase) = 1;
            - script.execute: reset_display
      - script.execute: aec_rearm_wake_word
    internal: false
    on_volume:
      - lambda: if (std::isfinite(x)) id(Vol) = clamp(x, 0.0f, 1.0f);
      - script.execute: aec_sync_output
    on_mute:
      - script.execute: aec_sync_output
    on_unmute:
      - script.execute: aec_sync_output
    on_state:
      - script.execute: aec_sync_output
  - platform: sendspin
    id: sendspin_media_player
    name: Radio AEC Music Assistant
    volume_increment: 2%
    on_state:
      - if:
          condition:
            media_player.is_playing: sendspin_media_player
          then:
            - script.stop: enter_idle_mode
            - script.execute: aec_rearm_wake_word
      - if:
          condition:
            lambda: return !id(assist_return_to_ma);
          then:
            - script.execute: aec_sync_output
      - script.execute: schedule_music_refresh
  - platform: speaker_source
    id: music_source_player
    internal: true
    on_state:
      - lambda: |-
          using media_player::MediaPlayerState;
          const bool playing = id(music_source_player).state == MediaPlayerState::MEDIA_PLAYER_STATE_PLAYING;
          if (playing != id(music_active)) {
            id(music_active) = playing;
            id(update_playback_mode).execute();
          }
    media_pipeline:
      speaker: music_speaker
      sources:
        - sendspin_source
      format: FLAC
      sample_rate: 48000
      num_channels: 2

# Wake-word detection remains available during MA playback through AEC.

micro_wake_word:
  id: mww
  microphone: radio_mic
  stop_after_detection: false
  models:
    - model: https://github.com/kahrendt/microWakeWord/releases/download/okay_nabu_20241226.3/okay_nabu.json
      id: okay_nabu
    - model: hey_jarvis
      id: hey_jarvis
    - model: hey_mycroft
      id: hey_mycroft
    - model: https://github.com/kahrendt/microWakeWord/releases/download/stop/stop.json
      id: stop
      internal: true
  on_wake_word_detected:
    then:
      - if:
          condition:
            and:
              - voice_assistant.connected:
              - not:
                  voice_assistant.is_running:
              - lambda: return !id(ble_provisioning_active) && !id(mic_muted) && !id(assist_return_to_ma);
          then:
            - micro_wake_word.stop:
            - if:
                condition:
                  lambda: |-
                    return id(music_active) ||
                        id(sendspin_media_player).state == media_player::MEDIA_PLAYER_STATE_PLAYING;
                then:
                  - lambda: id(aec_pending_wake_word) = wake_word;
                  - script.execute: temporary_assist
                else:
                  - light.turn_on:
                      id: screen_backlight
                      brightness: 100%
                      effect: none
                  - voice_assistant.start:
                      wake_word: !lambda |-
                        return wake_word;

voice_assistant:
  id: va
  microphone: radio_mic
  media_player: speaker_media_player
  micro_wake_word: mww
  use_wake_word: false
  noise_suppression_level: 2
  auto_gain: 31dBFS
  volume_multiplier: 2.0
  on_client_connected:
    - lambda: |-
        ESP_LOGI("assist_connection", "Home Assistant voice connected at %lu ms since boot",
                 static_cast<unsigned long>(millis()));
    - script.execute: refresh_assist_waiting_display
  on_client_disconnected:
    - lambda: |-
        ESP_LOGI("assist_connection", "Home Assistant voice disconnected at %lu ms since boot",
                 static_cast<unsigned long>(millis()));
    - script.execute: refresh_assist_waiting_display
    - script.execute: stop_ui_cue
  on_start:
    - script.execute:
        id: assist_trace
        event: HA pipeline started
    # A real request always takes priority over the boot melody.
    - script.execute: stop_ui_cue
  on_listening:
    - script.execute:
        id: assist_trace
        event: HA listening started
    - logger.log: listening 3 => phase
    - micro_wake_word.stop:
    - light.turn_on:
        id: screen_backlight
        brightness: 100%
        effect: none
    - lambda: id(phase) = 3;
    - script.execute: reset_display
    - script.execute:
        id: play_ui_cue
        kind: 2
  on_stt_vad_start:
    - script.execute:
        id: assist_trace
        event: HA detected speech start
  on_stt_vad_end:
    - script.execute:
        id: assist_trace
        event: HA detected speech end
    - script.execute: stop_ui_cue
    - script.execute: ui_mark_thinking
  on_stt_end:
    - script.execute:
        id: assist_trace
        event: HA transcription received
    - text_sensor.template.publish:
        id: text_request
        state: !lambda |-
          return x;
    - script.execute: ui_mark_thinking
  on_tts_start:
    - script.execute:
        id: assist_trace
        event: HA answer started
    - script.execute: stop_ui_cue
    - logger.log: answering  4 => phase
    - text_sensor.template.publish:
        id: text_response
        state: !lambda |-
          return x;
    - light.turn_on:
        id: screen_backlight
        brightness: 100%
        effect: none
    - lambda: id(phase) = 4;
    - script.execute: reset_display
  on_end:
    - script.execute:
        id: assist_trace
        event: HA pipeline ended
    - script.execute: stop_ui_cue
    - wait_until:
        and:
          - not:
              media_player.is_announcing:
                id: speaker_media_player
          - not:
              voice_assistant.is_running:
    - if:
        condition:
          lambda: return id(assist_return_to_ma);
        then:
          - script.execute: finish_temporary_assist
        else:
          - if:
              condition:
                lambda: return !id(music_active) && (id(phase) != 1);
              then:
                - lambda: id(phase) = 1;
                - script.execute: reset_display
  on_error:
    - script.execute:
        id: assist_trace
        event: !lambda return "HA error code=" + code;
    - script.execute: stop_ui_cue
    - logger.log: ERROR!!!!!!!!!!!!!!!!
    - light.turn_on:
        id: screen_backlight
        brightness: 100%
        effect: none
    - delay: 1s
    - if:
        condition:
          lambda: return id(assist_return_to_ma);
        then:
          - script.execute: finish_temporary_assist
        else:
          - lambda: if (!id(music_active)) id(phase) = 1;
          - script.execute: reset_display

output:
  - platform: gpio
    id: dac_mute
    pin:
      number: GPIO46
      inverted: true
      mode:
        output: true
      ignore_strapping_warning: true
  - platform: ledc
    pin:
      number: GPIO41
      mode:
        output: true
    id: screen_backlight_pin

light:
  - platform: monochromatic
    output: screen_backlight_pin
    id: screen_backlight
    name: Screen Backlight

globals:
  - id: ui_ready_sound_checked
    type: bool
    initial_value: 'false'
  - id: ui_cue_kind
    type: int
    initial_value: '0'
  - id: ui_cue_frame
    type: uint32_t
    initial_value: '0'
  - id: ui_cue_total_frames
    type: uint32_t
    initial_value: '0'
  - id: ui_cue_started_ms
    type: uint32_t
    initial_value: '0'
  # Closed until on_boot decides whether this is an unprovisioned device.
  - id: ble_provisioning_active
    type: bool
    initial_value: 'true'
  - id: music_active
    type: bool
    initial_value: 'false'
  - id: assist_return_to_ma
    type: bool
    initial_value: 'false'
  - id: assist_left_ma_group
    type: bool
    initial_value: 'false'
  - id: preset_message
    type: std::string
    initial_value: '""'
  - id: ma_player_entity_id
    type: std::string
    restore_value: true
    max_restore_data_length: 96
    initial_value: '""'
  - id: lightTO
    type: int
    initial_value: '0'
  - id: Vol
    type: float
    initial_value: '0.6'
    restore_value: true
  - id: ma_volume_target_percent
    type: int
    initial_value: '-1'
  - id: ma_volume_last_command_ms
    type: uint32_t
    initial_value: '0'
  - id: phase
    type: int
    initial_value: '0'
  - id: mute
    type: bool
    initial_value: 'false'
  - id: mic_muted
    type: bool
    initial_value: 'false'
  - id: auto_mute_active
    type: bool
    initial_value: 'false'
  - id: volume_display_active
    type: bool
    initial_value: 'false'
  - id: volume_display_timer
    type: int
    initial_value: '0'
  # Display state only; never used to control microphone/audio routing.
  - id: ui_thinking
    type: bool
    initial_value: 'false'
  - id: aec_pending_wake_word
    type: std::string
    initial_value: '""'

interval:
  - interval: 1s
    then:
      - script.execute: check_ready_sound
      - if:
          condition:
            and:
              - lambda: return id(ble_provisioning_active);
              - wifi.connected:
              - not:
                  script.is_running: ble_finish_wifi_setup
          then:
            - script.execute: ble_finish_wifi_setup
  - interval: 30s
    then:
      - lambda: |-
          if (id(ble_provisioning_active)) {
            ESP_LOGI("radio_ble", "Setup memory: internal=%u largest=%u DMA=%u largest_DMA=%u",
                     (unsigned) heap_caps_get_free_size(MALLOC_CAP_INTERNAL | MALLOC_CAP_8BIT),
                     (unsigned) heap_caps_get_largest_free_block(MALLOC_CAP_INTERNAL | MALLOC_CAP_8BIT),
                     (unsigned) heap_caps_get_free_size(MALLOC_CAP_DMA | MALLOC_CAP_INTERNAL),
                     (unsigned) heap_caps_get_largest_free_block(MALLOC_CAP_DMA | MALLOC_CAP_INTERNAL));
          }
  - interval: 1sec
    then:
      - if:
          condition:
            and:
              - light.is_on: screen_backlight
              - lambda: return id(lightTO) < 60;
          then:
            - lambda: id(lightTO)++;
          else:
            - lambda: id(lightTO) = 0;
            - light.turn_off: screen_backlight
      - if:
          condition:
            lambda: return id(volume_display_active);
          then:
            - if:
                condition:
                  lambda: return id(volume_display_timer) >= 3;
                then:
                  - lambda: |-
                      id(volume_display_active) = false;
                      id(volume_display_timer) = 0;
                      if (id(myDisplay).is_ready()) {
                        id(myDisplay).update();
                      }
                else:
                  - lambda: id(volume_display_timer)++;
      - if:
          condition:
            and:
              - lambda: return id(phase) == 0;
              - not:
                  light.is_on: screen_backlight
          then:
            - light.turn_on: screen_backlight
  - interval: 1s
    then:
      - script.execute: aec_tune_wake_word_task

